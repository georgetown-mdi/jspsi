# How to reach your exchange partner. channel is one of sftp, filedrop (a
# shared mounted directory), or webrtc; the block each one takes is at
# https://github.com/georgetown-mdi/jspsi/blob/main/docs/EXCHANGE_REFERENCE.md#connection-blocks-by-channel
connection:
  channel: sftp
  server:
    host: sftp.example.org
    port: 2222
    username: REPLACE_WITH_USER
    path: /exchanges/drop
  # Connection tuning, all optional; the defaults are shown below. Uncomment
  # and edit to change one.
  # Every wait for the partner's next file costs up to one poll_interval_ms, and
  # an exchange makes many, so the interval adds up across a run. Lower it on a
  # directory or a server you control.
  # options:
  #   poll_interval_ms: 5000
  #   server_connect_timeout_ms: 30000
  #   peer_timeout_ms: 3600000
  #   max_reconnect_attempts: 3
authentication:
  token_max_age_days: 7
linkage_terms:
  version: 1.0.0
  identity: Agency A
  date: 2025-01-01
  algorithm: psi
  linkage_strategy: cascade
  output:
    expects_output: true
    share_with_partner: false
  deduplicate: false
  linkage_fields:
    - name: ssn
      type: ssn
  linkage_keys:
    - name: SSN
      elements:
        - field: ssn
