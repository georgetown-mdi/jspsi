version: 2
updates:
  # Workspace root and all npm packages
  - package-ecosystem: npm
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Supply-chain hardening: never adopt a freshly published release. The
    # cooldown holds a new version until the ecosystem has had time to surface a
    # compromised release (hijacked maintainer token, malicious postinstall)
    # before we ingest it, trading a few days of patch latency for not being the
    # first to pull. It delays routine version bumps only.
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 5
    groups:
      # Cryptographic dependencies are grouped separately so they are reviewed
      # together and subject to the security review requirement in CONTRIBUTING.md.
      cryptographic:
        patterns:
          - "@openmined/psi.js"
          - "@noble/curves"
          - "node-forge"
          - "ssh2"
          - "ssh2-sftp-client"
      # The WebRTC stack is grouped (not batched into non-critical) because
      # every member is reached past its public API, so each bump must
      # re-verify that coupling before it merges: the web inbound bound drives
      # peerjs internals and parses the peerjs-js-binarypack wire format, and
      # the CLI transport drives werift's RTCPeerConnection and reads its SCTP
      # send queues. The two halves speak one data channel to each other, so a
      # bump on either side is reviewed against both -- see the "Upgrading the
      # PeerJS Stack" and "Upgrading the CLI WebRTC peer" checklists in
      # docs/spec/DEPENDENCY_PINS.md, mirroring the SFTP stack's exact-pin +
      # review treatment.
      webrtc-stack:
        patterns:
          - "peerjs"
          - "peerjs-js-binarypack"
          - "werift"
      # Batch routine dependency bumps to reduce noise. A package whose upgrade
      # carries a checklist in docs/spec/DEPENDENCY_PINS.md is excluded below,
      # or its bump rides this batch and is skimmed as routine instead;
      # scripts/check-dependabot-pin-coverage.mjs holds that pairing rather than
      # this comment.
      non-critical:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@openmined/psi.js"
          - "@noble/curves"
          - "node-forge"
          - "ssh2"
          - "ssh2-sftp-client"
          - "peerjs"
          - "peerjs-js-binarypack"
          - "werift"
          # Exact-pinned, matching-critical: both parties' runtime behavior for
          # these must stay byte-identical or PSI key derivation silently
          # diverges. Excluded so each bump is an individual, reviewable PR
          # instead of riding along in this batch -- see "Why these are
          # exact-pinned" in docs/spec/DEPENDENCY_PINS.md.
          - "re2js"
          - "yaml"
          - "canonicalize"
    ignore:
      # The OpenMined PSI module is vendored; updates require manual review
      # of the tarball and NOTICE file before the lock file is updated.
      - dependency-name: "@openmined/psi.js"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]

  # CLI Dockerfile base image
  - package-ecosystem: docker
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7

  # GitHub Actions used by the workflows in .github/workflows. Every action is
  # tag-pinned (e.g. actions/checkout@v7), and this block is configured against
  # that path.
  #
  # A pin that also appears in a composite action under .github/actions is not
  # relied upon to be tracked there. Coverage reaches it through the workflow
  # occurrence instead: scripts/check-action-pin-drift.mjs holds every composite
  # pin identical to a workflow pin, so a release or advisory surfacing on the
  # workflow pin covers the composite occurrence too, and the bump answering it
  # cannot land on the workflow and leave the composite stale.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      # Only default-days is valid for the docker and github-actions
      # ecosystems; the semver-*-days keys are supported for npm only.
      default-days: 7
    ignore:
      # An action pinned to a floating major tag (e.g. actions/checkout@v7)
      # already tracks the latest release within that major at runtime. A
      # minor/patch bump PR would only re-pin us to a specific, frozen version
      # (dropping later fixes) and add churn -- so within-major bumps are
      # ignored for these orgs and the major tags float. Major bumps (e.g.
      # checkout v6 -> v7) are NOT ignored and still surface for review.
      #
      # That rationale rests on every pin these entries cover in fact being a
      # floating major -- a property of the workflow trees, held by
      # scripts/check-dependabot-ignore-shape.mjs rather than by this comment.
      # An exact, sha, or branch pin from a listed org fails the build instead
      # of freezing under an ignore that suppresses its every update.
      #
      # An org whose actions are not floating-major pinned must stay off this
      # list for its bumps to surface -- sigstore is absent because
      # cosign-installer publishes no floating major tag, so it stays
      # exact-pinned (@v4.1.2) and its patch bumps are legitimate, reviewable
      # updates to the release-signing tool.
      #
      # A new floating-major action from another org should be added here.
      - dependency-name: "actions/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "docker/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "aws-actions/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "github/*"
        update-types:
          ["version-update:semver-minor", "version-update:semver-patch"]
