# Shared CI setup prologue: pin Node, install from the lockfile, and build
# @psilink/core. The four build/test workflows (static_checks, cli_build_and_test,
# release, eb_build_and_test) each run this before their app-specific build and
# test steps, so the Node version and install/cache strategy live in one place.
#
# Checkout is deliberately NOT part of this action: a local action referenced as
# ./.github/actions/setup only exists on the runner after actions/checkout has
# run, so each workflow keeps its own checkout step before calling this.
#
# Core is built here because the apps consume @psilink/core from its built dist/
# (the same way they do locally), so typecheck/build/test in every workflow needs
# it present first.
name: "Setup"
description: "Set up Node, install dependencies, and build @psilink/core"

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: "npm"
    - name: Verify vendored native tarball integrity
      # @openmined/psi.js is a file: dependency carrying prebuilt native .node
      # binaries. The lockfile's sha512 integrity covers what npm installs from
      # its cache; this covers the bytes in the tree, catching a swapped or
      # corrupted vendored artifact before install. See lib/*.tgz.sha256. Offline
      # and dependency-free, which is why it stays ahead of the provenance check
      # below and of npm ci. Stock macOS runners ship shasum, not sha256sum, so
      # this falls back to `shasum -a 256` there; both read the same sidecar
      # format under -c.
      run: |
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum -c lib/openmined-psi.js-*.tgz.sha256
        else
          shasum -a 256 -c lib/openmined-psi.js-*.tgz.sha256
        fi
      shell: bash
    - name: Verify vendored native tarball provenance
      # The sidecar above is written in the same psilink commit as the bytes it
      # describes, so it cannot bind them to the fork build that produced them.
      # This reads the GitHub artifact attestation stored against the PRODUCING
      # repository instead. It is armed per artifact by the marker committed
      # beside the tarball: armed, a non-zero verifier exit fails the job;
      # disarmed, it warns and the sidecar baseline stands. Runs before npm ci:
      # the script has no dependencies, only Node above it.
      run: npm run check:prebuild-provenance
      shell: bash
      env:
        # gh attestation verify queries api.github.com at verification time.
        GH_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: npm ci
      shell: bash
    - name: Build core
      run: npm run build -w packages/core
      shell: bash
