name: PR Checklist

# Validates the PR description's Checklist section on every pull request: no box
# left unchecked, none of the required lines deleted, every checked line carrying
# a resolution clause, and every n/a earned with a reason. This is the mechanical
# backstop for the template's "resolve every line" rule (the honesty of a reason
# stays a review call) -- see scripts/check-pr-checklist.mjs for the rules.
#
# Kept as its own workflow (rather than a job in static_checks.yaml) because it
# runs on `edited` too: fixing the PR body re-runs the check without pushing a
# new commit. static_checks stays commit-triggered -- its results depend only on
# the tree, so a body edit must not re-run it.

on:
  pull_request:
    branches: [main, staging]
    types: [opened, edited, reopened, synchronize]

# Cancel a superseded run when a newer commit or body edit lands on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: the check reads the repo for the script, and the pull request
# itself for the body, title and head it judges.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checklist:
    name: PR Checklist
    # Bot PRs skip the check: bots (dependabot targets staging) do not use the PR
    # template, and dependency PRs are gated by dependency_review.yaml instead.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The script is dependency-free, so a plain pinned Node suffices -- no npm
      # ci or @psilink/core build (the ./.github/actions/setup prologue) needed.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      # The pull request as the API holds it at this moment, rather than the copy
      # on the event payload. A commit and the body edit that re-attests it land
      # seconds apart: the push-triggered run carries a payload written before the
      # edit, judges the body it froze, and fails on a sha the author has already
      # updated -- and re-running it hands it that same frozen payload again. Only
      # the fields that cannot change over a pull request's life are read from the
      # payload above: its number, and whether its author is a bot. The path is
      # set on each step rather than on the job, where the runner context is not
      # available.
      - name: Fetch the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_JSON: ${{ runner.temp }}/pull-request.json
        run: gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$PR_JSON"
      # The body, title and head sha are read out of that file by the script. The
      # PR body is attacker-influenceable text, and a file keeps it out of both
      # the shell (a ${{ }} interpolation into a `run:` line would let a crafted
      # body inject commands into the runner) and $GITHUB_ENV (whose delimiter a
      # crafted body can close, setting any variable it likes).
      - name: PR checklist
        env:
          PR_JSON: ${{ runner.temp }}/pull-request.json
        run: npm run check:pr-checklist
