name: Static Checks

# Repo-wide static gate for every pull request. Kept separate from the
# build/test workflows (cli_build_and_test.yaml, eb_build_and_test.yaml), which
# are path-scoped to one app and run the heavier unit/integration suites. These
# checks span the whole monorepo -- a type error in a test file, an eslint
# violation, or prettier drift can land in any workspace -- so this workflow is
# intentionally NOT path-filtered.
#
# `npm run typecheck` runs each workspace's noEmit tsconfig, including the
# tsconfig.test.json files that cover test sources (the build/composite configs
# exclude test/ so test code never reaches the emitted dist). It resolves
# @psilink/core from the built package, so packages/core is built first.
#
# Two jobs, two required-status-check identities. `Typecheck, Lint, Format`
# carries only the three checks it names, so the context holding the merge
# gate's critical path is the one a contributor iterates on; `Guards, Scripts,
# Audit` carries the repo-wide guard checks, the scripts suite, and the
# production dependency audit, in parallel with it. Each job's `name:` is its
# identity on main and staging, which is why neither is renamed as the checks
# accumulate past what it enumerates. The second identity is carried by the
# `staging` and `main` rulesets, an edit made on the GitHub side rather than
# here; while it is absent that job runs on every pull request without gating a
# merge. The merge-gate identities check, one of the checks `check:all` below
# runs, holds both identities against the branch rules whenever the run has a
# token that can read them, and states a skip when it does not.
#
# Both jobs pay the setup action, since the second holds every check that reads
# node_modules and the vectors check that reads the @psilink/core build.

on:
  pull_request:
    branches: [main, staging]

# Cancel a superseded run when a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: these checks only need to read the repo.
permissions:
  contents: read

jobs:
  static-checks:
    name: Typecheck, Lint, Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pins Node, installs from the lockfile, and builds @psilink/core (built
      # first so the CLI and web typechecks resolve its declarations from dist,
      # the same way the apps consume it).
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run formatcheck

  repo-guards:
    name: Guards, Scripts, Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The comment history-narration check reads the comment lines the pull
          # request adds against its base branch, which it finds through `git
          # merge-base` in the checkout. The default single-commit fetch carries
          # no base branch to find, and the check fails rather than passing an
          # empty range, so this job takes the full history. The job beside it
          # keeps the default.
          fetch-depth: 0
      # Pins Node, installs from the lockfile, and builds @psilink/core. Most of
      # the checks below read their parsers and fixtures out of the install; the
      # vectors check reads the built dist, since its generators import the
      # package the way the apps do.
      - uses: ./.github/actions/setup
      # Every repo-wide guard, driven from the one list in
      # scripts/run-checks.mjs: a line per check saying what it holds, with each
      # check's reasoning left in its own script header. `npm run check:all` is
      # the same run locally, and the runner goes on past a failing check, so
      # one red result does not hide the state of the rest. The list is held
      # to the root package.json's `check:*` scripts -- and this job to this one
      # step plus the audit below -- by scripts/run-checks.test.mjs, so a new
      # check is classified rather than appended here. The merge-gate check
      # reads the branch rules through the run's own token and states a skip --
      # a run annotation, not a silent pass -- when it cannot.
      - name: Repository checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:all
      # Blocking half of the dependency audit, over the production tree the
      # shipped image runs: the release SBOM's scope -- the two workspaces the
      # Dockerfile's production install names, plus apps/web, whose
      # runtime dependencies ship inside the pre-bundled Nitro output rather
      # than through an install -- and the same command string CONTRIBUTING.md's
      # Dependency Policy and docs/RELEASES.md step 4 hand a maintainer, so the
      # local run and the gate cannot diverge. The wrapper it runs through
      # (scripts/npm-audit-retry.mjs) adds one thing to that command: a bounded
      # retry of npm's audit endpoint failing, which is a registry outage rather
      # than anything about the branch under test, and which reddened ten open
      # pull requests at once when it last happened. An advisory finding is never
      # retried -- see the script's header for how the two are told apart, and
      # its test for the drive against the real npm that settles it. It answers
      # `found 0 vulnerabilities` against the committed lockfile, so it gates on
      # any finding at all: no `--audit-level`, because relaxing the threshold to
      # clear one accepted finding is a standing acceptance of every future
      # finding below it, and no allowlist or per-advisory suppression, because
      # whether a package ships is a property npm recomputes on every run -- an
      # advisory that crosses onto a production edge blocks here by itself, where
      # a written exception would keep suppressing after its reason expired.
      #
      # This scope holds the exact-pinned SFTP and WebRTC stacks, so a red gate
      # over one of them is resolved by the deliberate, security-reviewed bump
      # docs/spec/DEPENDENCY_PINS.md specifies -- never by `npm audit fix`, which
      # the Dependency Policy forbids there precisely because it lands unreviewed.
      # Development-tree findings are outside this scope by construction and are
      # reported by dependency_audit.yaml rather than gated here.
      #
      # Last, so an advisory standing open over the production tree does not mask
      # this job's other results.
      - name: Dependency audit (production scope)
        run: npm run audit:production
