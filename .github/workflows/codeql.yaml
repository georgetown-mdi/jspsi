name: CodeQL

# GitHub CodeQL static analysis (SAST) for the JavaScript/TypeScript sources.
# CodeQL extracts the repo into a queryable database and runs security queries
# with taint / data-flow tracking -- tracing untrusted input (sources) to
# dangerous operations (sinks) across function boundaries, which the eslint and
# format gate in static_checks.yaml cannot do. The three security workflows
# complement rather than overlap: static_checks is style and type correctness,
# dependency_review.yaml gates the supply-chain graph a PR adds, and this
# analyzes first-party code.
#
# Free here: code scanning with CodeQL is free on public repositories
# (georgetown-mdi/jspsi is public), so this needs no GitHub Advanced Security
# license. Findings surface as code-scanning alerts in the repository Security
# tab.
#
# A merge gate. Two check runs come out of this analysis and both belong on the
# required-status-check list for main and staging: `Analyze
# (JavaScript/TypeScript)`, the job below, so an analysis that fails to run
# cannot be waved through; and `CodeQL`, the code-scanning results check GitHub
# raises from the uploaded SARIF, which is the half that turns red when a pull
# request introduces an alert. Neither is path-filtered, so neither can
# path-skip into the permanently-pending state a required check falls into when
# its workflow is skipped -- the footgun image_smoke.yaml documents. The
# merge-gate identities check, run by the Repository checks step of
# static_checks.yaml, holds that: this file carrying a path filter under
# on.pull_request fails it.
#
# What promoted it, measured 2026-08-08 over the code-scanning alert history
# since the 2026-07-23 baseline scan: 234 pull-request analyses across 178 pull
# requests, of which exactly one reported any result -- a staging-to-main merge
# pull request carrying two alerts already in the baseline, not findings on its
# diff. Every alert in the repository was created by that first baseline scan;
# none has been raised by a pull request. The baseline's 27 alerts are all
# triaged closed (17 fixed, 5 dismissed false-positive, 5 dismissed won't-fix),
# so the gate turns on against an empty board rather than blocking unrelated
# work. That false-positive rate on real pull requests is what the earlier
# advisory posture was waiting on. If it rises, move back to advisory and record
# why -- dismissing findings to keep the gate green is the dishonest exit.
#
# JavaScript/TypeScript needs no build step (build-mode: none): CodeQL extracts
# the sources directly, so unlike the build/test workflows this neither runs the
# ./.github/actions/setup prologue nor builds @psilink/core.

on:
  # Manual trigger for an on-demand full-tree scan (PR runs are diff-informed);
  # how a maintainer re-baselines a branch without waiting for the schedule.
  workflow_dispatch:
  # On a PR, analyze the changes and surface new alerts on the PR itself.
  pull_request:
    branches: [main, staging]
  # On merge to a base branch, refresh that branch's alert baseline so alert
  # tracking and auto-dismissal stay correct and the Security tab reflects the
  # merged state.
  push:
    branches: [main, staging]
  # Weekly re-scan of unchanged code against an updated query pack, catching
  # newly-published vulnerability patterns with no code change to trigger a run.
  # Monday, to match the Dependabot cadence in .github/dependabot.yml.
  schedule:
    - cron: "30 5 * * 1"

# Cancel a superseded run when a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege at the top level; the analyze job widens to what the SARIF
# upload needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF results as code-scanning alerts.
      security-events: write
      # actions/checkout.
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          # Path scoping only; the config file holds the globs and the rationale
          # (including one known, assessed shipped-source drop). Queries stay
          # inline below, not in the config.
          config-file: ./.github/codeql/codeql-config.yml
          # security-extended: broader security coverage than the default
          # code-scanning suite, without the maintainability and style queries
          # of security-and-quality (off-topic noise for a security control).
          queries: security-extended
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
