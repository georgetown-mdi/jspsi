name: Build and Test for Elastic Beanstalk

# Yoinked from here:
# https://blog.danskingdom.com/Multiple-ways-to-setup-your-CI-CD-pipelines-in-GitHub-Actions/#approach-5-deploy-workflow-includes-build-workflow-and-uses-template-for-deployments-include-approach-with-reusable-workflows

on:
  # PR validation only, scoped by path to web/core-affecting changes. Deploys
  # build through eb_deploy.yaml's workflow_call, so there is no standalone push
  # trigger here -- it would double-run with the pull_request event on a feature
  # branch that already has an open PR. If this job becomes a required status
  # check, configure branch protection so a path-skipped run does not block an
  # unrelated PR -- a skipped required check otherwise stays pending.
  #
  # Note: this PR filter deliberately diverges from the push filter in
  # eb_deploy.yaml on test sources -- it uses the broad apps/web/** and
  # packages/core/** globs so a test-only PR (deleting or weakening assertions,
  # or changing vitest config) still runs the full suite, including the core
  # tests this gate runs via `npm run -w packages/core test`. The deploy filter
  # stays scoped to deploy-affecting sources only and omits the test/** trees.
  # The two filters cannot share a single list because of this intentional
  # difference. packages/core/** matches the sibling cli_build_and_test.yaml,
  # and packages/peerjs-broker/** is here because the web app consumes the
  # signaling broker from that workspace and bundles it into the deployed
  # server. packages/testkit/** is here for the same reason the test trees are:
  # the web unit suite is driven by fixtures that workspace holds, so a change
  # confined to them would otherwise weaken this gate without re-running it.
  pull_request:
    branches: [main, staging]
    paths:
      - "lib/**"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "apps/web/**"
      - "packages/core/**"
      - "packages/peerjs-broker/**"
      - "packages/testkit/**"
      - ".github/actions/setup/**"
      - ".github/workflows/eb_build_and_test.yaml"
      # The deploy-trigger coverage check below reads eb_deploy.yaml's push
      # filter, so a pull request that edits only that filter has to reach this
      # workflow -- narrowing the filter is exactly the change the check exists
      # to catch, and it touches nothing else here.
      - ".github/workflows/eb_deploy.yaml"

  workflow_call:
    outputs:
      artifactName:
        description: "Name of the uploaded artifact"
        value: ${{jobs.build-and-test.outputs.artifactName}}

# Cancel a superseded PR run when a newer commit lands on the same PR/branch.
# NOT keyed on github.workflow: in a workflow_call invocation the github context
# is the caller's, so github.workflow resolves to eb_deploy.yaml's name and this
# block would share eb_deploy.yaml's concurrency group, self-cancelling the
# deploy on a single push (a GitHub Actions reusable-workflow footgun). A literal
# prefix keeps this group independent of any caller. The || github.run_id
# fallback gives the deploy leg's reused build a unique group (head_ref is empty
# off pull_request), so cancel-in-progress is inert there and never cancels a
# deploy; on a PR, head_ref groups the PR's runs so a newer commit supersedes.
concurrency:
  group: eb-build-and-test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege: this build/test gate only needs to read the repo.
permissions:
  contents: read

env:
  ARTIFACT_NAME: ${{format('{0}-{1}', vars.EB_APPLICATION_NAME, github.sha)}}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Bound the job: this is the one CI job that drives a real browser and a live
    # WebRTC exchange through a spawned dev server -- workloads that can wedge in
    # ways the suite's own 60s timeouts do not all catch (a stuck browser or
    # teardown, a stalled data channel). Without this the default 6h timeout
    # applies, and since eb_deploy.yaml gates its deploy on this job via
    # workflow_call, a hang would also stall a production deploy. 30 min sits far
    # above a normal run (install + builds + tests + browser provisioning) yet
    # cuts a true hang short. It must also clear the worst case the browser
    # provisioning step below is allowed: its 22 min plus the ~4 min the rest of
    # the job measures, so an upstream stall there ends on that step's own named
    # failure rather than on this cap, which GitHub reports as a cancellation.
    timeout-minutes: 30
    outputs:
      artifactName: ${{steps.artifact-name.outputs.artifactName}}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      # Pins Node, installs from the lockfile, and builds @psilink/core.
      - name: Set up and build core
        uses: ./.github/actions/setup
      - name: Build server
        run: npm run -w apps/web build
      # eb_deploy.yaml's push filter is narrower than the trees it names, on the
      # premise that what it leaves out is in no deployed import graph. This
      # holds that premise against a real build: every repository source the
      # deployed server reads has to match a filter that redeploys it, or an
      # edit to it ships nothing and production goes stale with nothing red.
      # Here rather than in the repo-wide static checks because that gate is
      # deliberately unfiltered and this needs a web build, while this workflow
      # is already scoped to the trees that can break the premise and has the
      # dependencies installed. It runs its own instrumented build (the recorder
      # in apps/web/vite.config.ts adds no hook that can change a chunk), and
      # runs before the tests so the artifact packaged below is the build whose
      # graph was read.
      - name: Deploy trigger coverage
        run: npm run check:deploy-trigger-graph
      - name: Run tests
        run: |
          npm run -w packages/core test
      # The web suites below skip the legs whose environment prerequisites are
      # absent (a loopback TLS certificate, which needs `openssl`), and
      # apps/web/test/requireTestPrerequisites.ts turns such a skip into a
      # failure only where CI marks an environment provisioned to a spec. GitHub
      # Actions sets CI on every job, so the gate is armed here -- asserted
      # rather than assumed, because if that ever stopped holding the gate would
      # go quiet with nothing failing. The expression is the guard's own
      # predicate: set, and not the string "false".
      - name: Assert the test-prerequisite gate is armed
        run: test "${CI:-false}" != "false"
      # Web unit tests run in the node environment against the already-built
      # @psilink/core -- no dev server or Docker (the integration and browser
      # projects are the ones that stand up a server), so the shared setup above
      # is all they need. Kept a discrete step from the core "Run tests" above so
      # a web-unit regression gives a clear failure signal of its own.
      - name: Web unit tests
        run: npm run test:unit -w apps/web
      # The cross-runtime suite drives the real `psilink` program against a party
      # built from this app's own exchange modules, so it needs the CLI built --
      # nothing else in this workflow does, which is why the build is a step of
      # this pair rather than of the shared setup. It stands up no server and no
      # browser: its whole world is a temporary file-drop directory.
      #
      # It runs here AND on the CLI workflow's own leg, deliberately: the drift it
      # exists to catch can land on either runtime, and each workflow's path
      # filter sees only its own.
      - name: Build the CLI for the cross-runtime suite
        run: npm run build -w apps/cli
      - name: CLI/web cross-runtime interop
        run: npm run test:interop -w apps/web
      # apt applies no network timeout of its own, so a mirror connection that
      # goes quiet hangs the --with-deps install below with nothing to time it
      # out.
      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
      # The browser build a playwright release drives is keyed to that release, so
      # the cache below is keyed on the version `npm ci` actually installed rather
      # than the range apps/web declares. Resolved from apps/web, which owns the
      # dependency, so a layout that stops hoisting playwright to the repository
      # root still finds it.
      - name: Resolve the installed Playwright version
        id: playwright
        working-directory: apps/web
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A hit restores the browser build into the directory the install step below
      # reads, taking the download CDN out of the run entirely; the apt libraries
      # --with-deps installs are not in this cache and are installed on every run
      # regardless. No restore-keys: a build saved under another playwright version
      # is not the one this version drives, and restoring it would only carry it
      # into the next save. Restoring and saving are separate steps so the save
      # sits after the install below rather than in a post-job step: a browser
      # directory left partial by a provisioning run that failed every attempt is
      # then never archived under this key, whose entry no later run of the same
      # playwright version could replace.
      - name: Restore the Playwright browser build
        id: browser-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{runner.os}}-${{runner.arch}}-${{steps.playwright.outputs.version}}
      # A hit that restores nothing falls through to a silent re-download -- the
      # cost this cache exists to remove -- so fail on the empty restore instead of
      # paying it unremarked.
      - name: Verify the restored browser build
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: test -n "$(ls -A ~/.cache/ms-playwright)"
      # The browser project (below) drives real Chromium; the stock ubuntu-latest
      # runner ships none, so provision it and the apt libraries it links against
      # here, before that project runs. --with-deps installs those apt libraries;
      # on Node 26 this needs playwright >= 1.60 (earlier versions hang extracting
      # the browser archive, microsoft/playwright#40724) -- the lockfile pins
      # >= 1.61, so do not downgrade. (The dev container provisions Chromium
      # separately and is maintained independently.)
      #
      # An upstream that trickles rather than falls silent -- the apt mirror the
      # timeouts above cannot catch, or the browser CDN -- stalls this command
      # instead of failing it, and a plain rerun has been enough to clear it, so
      # each attempt bounds the whole command and a stalled attempt is retried here
      # rather than costing a human rerun of the workflow. The 10m per-attempt
      # bound clears the slowest measured success (7m24s) with headroom; two
      # attempts, each with timeout's 30s kill-after grace, plus the 15s backoff
      # between them total 21m15s, inside timeout-minutes, so the per-attempt
      # bound is what fires and names the failure, and timeout-minutes fits
      # inside the job bound above.
      - name: Install Playwright Chromium
        timeout-minutes: 22
        run: |
          attempts=2
          attempt_timeout=10m
          for attempt in $(seq 1 "$attempts"); do
            status=0
            timeout --kill-after=30s "$attempt_timeout" npx playwright install --with-deps chromium || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 124 ]; then
              outcome="hit the $attempt_timeout bound"
            else
              outcome="failed with exit status $status"
            fi
            echo "::warning::Playwright provisioning attempt $attempt $outcome"
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 15
            fi
          done
          echo "::error::Playwright provisioning failed on all $attempts attempts; the last one $outcome"
          exit "$status"
      - name: Save the Playwright browser build
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{runner.os}}-${{runner.arch}}-${{steps.playwright.outputs.version}}
      # Integration and browser tests both stand up the web dev server through a
      # shared, self-managing vitest globalSetup (it spawns the server, waits for
      # readiness, reuses a running one, and tears it down -- no manual step and no
      # Docker; integration hits the HTTP/SSE routes in node, browser drives
      # Chromium). Running both projects in ONE vitest process lets that setup
      # start the server once and the second project reuse it, rather than two
      # invocations each paying a full cold start -- so keep them combined via the
      # dedicated test:integration:browser script (which names both projects
      # explicitly). Splitting back into separate test:integration + test:browser
      # steps reintroduces the second cold start. vitest still reports per
      # project/file, so a failure names the suite that broke.
      #
      # The integration project gates the web deploy on the app's own behavior
      # (independent of the CLI, whose tests live in release.yaml); the browser
      # project covers the security-relevant accept-screen controls (the consent
      # gate over the PII exchange and the decode-error escaping) plus the live PSI
      # exchange and cross-implementation vectors -- behavior no other CI job
      # covers, since it needs a DOM the node projects lack, so a browser-only
      # regression would otherwise ship unnoticed. Both run on the PR gate and this
      # workflow's push/deploy path, so the deploy artifact is gated on them too.
      - name: Web integration and browser tests
        run: npm run test:integration:browser -w apps/web
      - name: Package for Elastic Beanstalk
        run: |
          cp -a apps/web/deploy/aws_eb/. apps/web/.output
          touch apps/web/.output/.env
          (cd apps/web/.output && zip -r ../../../${{github.sha}}.zip .)
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.ARTIFACT_NAME}}
          path: ${{github.sha}}.zip
          compression-level: 0
      - name: Output artifact name
        id: artifact-name
        run: echo "artifactName=${{env.ARTIFACT_NAME}}" >> "$GITHUB_OUTPUT"
