name: Nightly Live WebRTC Interop

# Scheduled nightly run of the live CLI-to-browser WebRTC leg
# (apps/web/test/liveWebrtc): a real `psilink` process and a real browser peer
# completing one WebRTC PSI exchange through the standalone signaling broker,
# with each side's association table asserted and each side's clean-close wait
# measured.
#
# Nightly rather than per pull request. The leg pays for a browser build, a CLI
# build, and minutes of real ICE, DTLS, SCTP and WASM work for one exchange,
# and what it guards -- a divergence between the two implementations on the
# wire -- moves on the cadence the two transports change, not on the cadence
# pull requests land. The standing per-PR guarantee is the pair of known-answer
# interop legs (`npm run test:interop -w apps/web` and the cross-implementation
# vectors in the browser project), which this leg complements and does not
# replace; see docs/TESTING.md.
#
# Runs only on schedule and manual workflow_dispatch -- never on push or
# pull_request -- so the pull-request gate is unaffected. Two GitHub behaviors
# to know: a `schedule` trigger only fires from the workflow as it exists on the
# default branch, so no nightly runs until this file lands there (use the manual
# dispatch below to exercise it before then); and GitHub disables a scheduled
# workflow after ~60 days without repo activity, emailing the last committer --
# re-enable it from the Actions tab if a long-quiet repo needs this guard back.

on:
  schedule:
    # 04:57 UTC nightly, off the hour per GitHub's guidance to avoid
    # top-of-hour congestion on the shared scheduler, and clear of the other
    # nightlies (nightly_core_stress.yaml's 04:17, nightly_platform.yaml's
    # 04:37) and of the weekly Monday scans starting at 05:30.
    - cron: "57 4 * * *"
  workflow_dispatch:

# One run at a time per ref; do not cancel an in-flight run (it is driving two
# live peers) -- this only guards a manual dispatch racing the schedule.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: this test job only needs to read the repo.
permissions:
  contents: read

jobs:
  live-webrtc:
    name: Live CLI-to-browser WebRTC exchange
    runs-on: ubuntu-latest
    # Bound the job: it drives a real browser, a real broker and a real
    # `psilink` process, workloads that can wedge in ways the leg's own
    # timeouts do not all catch. The leg itself measures well under a minute
    # once provisioned; the rest of this budget is the browser provisioning
    # below and its own 20-minute bound.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # A scheduled workflow otherwise takes the default branch, but staging
          # is promoted to main slowly, so checking out main here would catch a
          # regression late. staging is the branch this nightly exists to watch.
          # A manual dispatch instead takes the ref it was dispatched on, so a
          # fix can be confirmed on its own branch before it lands.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'staging' }}
      # Pins Node, installs from the lockfile, and builds @psilink/core.
      - uses: ./.github/actions/setup
      # The party on the CLI side of this leg is the real command-line program,
      # so it has to be built; the leg refuses to start without it rather than
      # skipping.
      - name: Build the CLI for the live leg
        run: npm run build -w apps/cli
      # apt applies no network timeout of its own, so a mirror connection that
      # goes quiet hangs the --with-deps install below with nothing to time it
      # out.
      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
      # The browser build a playwright release drives is keyed to that release,
      # so the cache below is keyed on the version `npm ci` actually installed
      # rather than the range apps/web declares. The key matches the one
      # eb_build_and_test.yaml writes, so this job usually restores that gate's
      # entry rather than downloading a browser of its own.
      - name: Resolve the installed Playwright version
        id: playwright
        working-directory: apps/web
        run: |
          version="$(node -p "require('playwright/package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore the Playwright browser build
        id: browser-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{runner.os}}-${{runner.arch}}-${{steps.playwright.outputs.version}}
      # A hit that restores nothing falls through to a silent re-download -- the
      # cost this cache exists to remove -- so fail on the empty restore instead
      # of paying it unremarked.
      - name: Verify the restored browser build
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: test -n "$(ls -A ~/.cache/ms-playwright)"
      # The stock ubuntu-latest runner ships no Chromium, so provision it and
      # the apt libraries it links against. On Node 26 this needs playwright >=
      # 1.60 (earlier versions hang extracting the browser archive,
      # microsoft/playwright#40724) -- the lockfile pins >= 1.61, so do not
      # downgrade.
      - name: Install Playwright Chromium
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium
      - name: Save the Playwright browser build
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{runner.os}}-${{runner.arch}}-${{steps.playwright.outputs.version}}
      # The leg stands up the broker and the CLI party itself. A failure of
      # either is reported under the leg's own environment prefix, which is what
      # separates a broken runner from an interop divergence in this job's log.
      - name: Live CLI-to-browser WebRTC exchange
        run: npm run test:live-webrtc -w apps/web
