name: CLI Build and Test

# Pull-request gate for the CLI (apps/cli), kept separate from
# eb_build_and_test.yaml -- which builds and tests only the web app for its
# Elastic Beanstalk deploy. This is the merge-time gate that catches a
# dependency bump breaking the ssh2 SFTPWrapper coupling the SFTP adapter
# relies on (see docs/spec/DEPENDENCY_PINS.md, "Upgrading the SFTP Stack"); the same
# integration suite also runs in release.yaml as the ship gate before publish.
#
# Scoped by path to CLI-affecting changes. If the terminal `Test` job is made a
# required status check, configure branch protection so a path-skipped run does
# not block an unrelated PR -- a skipped required check otherwise stays pending.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/cli/**"
      - "packages/core/**"
      - "lib/**"
      # The CLI's WebRTC signaling suite drives the PeerJS broker as a spawned
      # process (apps/cli/test/signaling/brokerProcess.ts), so a change to the
      # broker workspace or to the standalone entry point it spawns must re-run
      # this gate.
      - "packages/peerjs-broker/**"
      # The CLI's unit suite is driven by fixtures this workspace holds
      # (docs/TESTING.md, Shared test material), so a change confined to them
      # weakens this gate's own assertions unless it re-runs the gate.
      - "packages/testkit/**"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".github/actions/setup/**"
      - ".github/workflows/cli_build_and_test.yaml"

# Cancel a superseded run when a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: this build/test gate only needs to read the repo.
permissions:
  contents: read

jobs:
  # The six suites this gate runs share no mutable state, so they run as
  # parallel legs of one matrix rather than as serial steps of one job, and the
  # gate's wall time is its slowest suite rather than their sum. Each leg is a
  # runner of its own, and within a leg each suite stands up everything it
  # touches: the SFTP suite's server binds loopback on an ephemeral port
  # (test/sftpServer/inProcessServer.ts, test/sftpServer/nativeSshdServer.ts)
  # under a globalSetup only the `integration` project references
  # (test/sftpServer/globalSetup.ts); the WebRTC suite spawns a broker per file
  # that reports the port it chose (test/signaling/brokerProcess.ts) behind
  # loopback listeners on ephemeral ports (test/signaling/tlsBrokerFront.ts,
  # test/signaling/sniVhost.ts); the backend-agnostic and cross-runtime suites
  # each work in a fresh mkdtemp directory. Nothing crosses a leg boundary.
  #
  # The terminal `test` job below holds one stable name for a required status
  # check to name, since each leg's own check-run name carries its leg values.
  suite:
    name: Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            command: npm run test:unit -w apps/cli
          # Integration tests exercise the real ssh2 SFTPWrapper contract end to
          # end (unit tests run against mocks), so they are what actually
          # catches a dependency bump that breaks the coupling. The suite is
          # self-managing: a vitest globalSetup starts the SFTP test server
          # before it and stops it after, so no extra setup step is needed.
          #
          # ALCOVE_REQUIRE_WORKER_BUILD=1 makes the real-worker offload suite
          # FAIL (not skip) if the CLI bundle is missing, so a regressed build
          # step cannot let that suite silently no-op green here -- mirroring
          # ALCOVE_SFTP_CHROOT_REQUIRED in the chroot leg. It is set on the two
          # legs that build the CLI, this one and the native sshd leg; the
          # hardened legs do not build it and skip.
          - suite: in-process sftp
            command: npm run test:integration -w apps/cli
            build-cli: "true"
            require-worker-build: "1"
          # The WebRTC suite is a vitest project of its own
          # (apps/cli/vitest.config.mts) so it runs exactly once per pull
          # request, here. It drives two loopback werift peers through the
          # vendored broker it spawns itself, which the SFTP backend has no
          # bearing on, so repeating it on the native leg and on each
          # hardened-sshd matrix leg would buy nothing for several minutes of
          # runner time. Those legs run the `integration` project, which
          # excludes it.
          - suite: webrtc
            command: npm run test:integration:webrtc -w apps/cli
          # The integration files no SFTP backend differentiates are a project
          # of their own for the same reason (apps/cli/vitest.config.mts): each
          # drives a filedrop directory or a listener of its own, so repeating
          # them on the native and hardened-sshd legs would buy nothing.
          - suite: backend-agnostic
            command: npm run test:integration:backend-agnostic -w apps/cli
          # The cross-runtime suite: the built CLI meeting a party assembled
          # from the web app's own exchange modules over one file-drop
          # directory. It is a web-workspace script because only that workspace
          # may import apps/web/src, but the drift it catches lands as readily
          # on this side of the wire, so it runs on this workflow's path filter
          # as well as on the web app's own
          # (.github/workflows/eb_build_and_test.yaml). It stands up no server
          # and no browser, and it spawns the CLI from apps/cli/dist
          # (apps/web/test/interop/cliParty.ts), so this leg builds it.
          - suite: cross-runtime interop
            command: npm run test:interop -w apps/web
            build-cli: "true"
          # A second run of the same suite against a native OpenSSH sshd, so the
          # adapter is also exercised against a real server.
          - suite: native sshd
            command: npm run test:integration -w apps/cli
            sftp-backend: native
            native-sshd: "true"
            build-cli: "true"
            require-worker-build: "1"
    steps:
      - uses: actions/checkout@v7
      # Pins Node, installs from the lockfile, and builds @alcove/core. Those
      # two are what every leg would otherwise repeat; the action restores both
      # from content-keyed caches, so they are paid once per lockfile and
      # core-source state across the whole repository rather than once per leg.
      - uses: ./.github/actions/setup
      # sshd ships on the Ubuntu runner, but its build fatally checks for the
      # privilege-separation directory at startup even when run unprivileged.
      - name: Create the sshd privilege-separation directory
        if: matrix.native-sshd == 'true'
        run: sudo mkdir -p /run/sshd
      # The three legs that read apps/cli/dist build it themselves rather than
      # taking it from a producer job. The build is 6.5 s over a 1.6 MB tree
      # (measured locally), so a job of its own -- runner start, checkout,
      # setup, and an artifact round trip -- would cost more runner time than
      # the one repeated build it saves, and would serialize ahead of the
      # slowest suite.
      - name: Build CLI
        if: matrix.build-cli == 'true'
        run: npm run build -w apps/cli
      - name: Run the ${{ matrix.suite }} suite
        run: ${{ matrix.command }}
        env:
          # Absent from a matrix entry these read as the empty string, which
          # both readers treat as unset: apps/cli/test/sftpServer/index.ts maps
          # "" to the in-process backend, and
          # apps/cli/test/integration/psiWorkerRealWorker.test.ts compares
          # against the literal "1".
          ALCOVE_REQUIRE_WORKER_BUILD: ${{ matrix.require-worker-build }}
          ALCOVE_SFTP_BACKEND: ${{ matrix.sftp-backend }}

  # The one job name a required status check can name, standing for every suite
  # leg above. `if: always()` is what makes it usable as one: without it a failed
  # leg leaves this job skipped, and a skipped required check stays pending
  # rather than red, so the pull request would be unmergeable with nothing red
  # to show for it.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: suite
    if: always()
    steps:
      - name: Report the suite results
        env:
          RESULT: ${{ needs.suite.result }}
        run: |
          echo "suite legs: $RESULT"
          test "$RESULT" = success

  # Phase 3 hardened native-sshd profiles. The same conformance suite runs against
  # the native backend under each hardened configuration real deployments use
  # (restricted kex/cipher policy, connection/auth rate limits, an explicit user
  # allowlist), proving the pure-JS ssh2 adapter still negotiates and runs under
  # them. Additive and parallel: the in-process and native sshd legs of the
  # `suite` matrix above are unchanged. Integration tests import the adapter
  # from src (vitest transpiles) and consume @alcove/core from the setup
  # action's build, so no CLI build step is needed. If the added CI minutes
  # prove too costly, trim this matrix -- the three hardened profiles are
  # independent legs.
  hardened-native:
    name: Hardened native sshd (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [restricted-crypto, rate-limited, allowlist]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Integration tests (CLI, native sshd, ${{ matrix.profile }} profile)
        run: |
          # sshd fatally checks for its privilege-separation directory at startup
          # even when run unprivileged (as the native sshd leg notes), so
          # create it here.
          sudo mkdir -p /run/sshd
          npm run test:integration -w apps/cli
        env:
          ALCOVE_SFTP_BACKEND: native
          ALCOVE_SFTP_NATIVE_PROFILE: ${{ matrix.profile }}

  # The chroot profile confines the SFTP session with ChrootDirectory, which needs
  # sshd to run as root over a root-owned jail. The Ubuntu runner has passwordless
  # sudo, so this leg runs the suite as root; the runner (test/sftpServer/
  # runChrootProfile.mjs) would skip cleanly with exit 0 where root is
  # unavailable. PATH is forwarded through sudo so npm and node resolve as root.
  #
  # Gated to same-repository (non-fork) PRs: this is the one leg that runs a whole
  # test process as root via passwordless sudo, so it is not exposed to fork PRs,
  # which run untrusted workflow/code. Branch PRs (this repo's normal flow) still
  # get full chroot coverage. If this job is ever made a required status check,
  # configure branch protection so the skipped fork-PR run does not block the PR.
  chroot-native:
    name: Hardened native sshd (chroot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Integration tests (CLI, native sshd, chroot profile)
        run: |
          # sshd needs its privilege-separation directory present at startup.
          sudo mkdir -p /run/sshd
          # ALCOVE_SFTP_CHROOT_REQUIRED=1 makes the runner FAIL (not skip) if it
          # cannot run as root here, so a broken sudo elevation cannot let this
          # leg go green without actually exercising the chroot path. It is set
          # via env (not sudo's environment) since sudo forwards only PATH.
          sudo --preserve-env=PATH \
            env "PATH=$PATH" ALCOVE_SFTP_CHROOT_REQUIRED=1 \
            npm run test:integration:native-chroot -w apps/cli

  # `alcove doctor` against a real Samba server. Its unit tests drive a recorded
  # smbclient transcript, which pins the classification but cannot settle what the
  # real tool does -- whether the dialect pair `-m X --option=client min protocol=X`
  # is accepted, whether a `put` resolves its local side against the child's
  # working directory, what status a read-only share actually answers with. Those
  # are settled here, by driving the real tool against a real server, and by
  # mounting that same share through CIFS for the mount-semantics checks.
  #
  # The Samba account below is a throwaway created on the runner for this job. It
  # authenticates only to this runner's own loopback smbd, holds nothing, and is
  # destroyed with the runner, so it is written in the clear rather than carried as
  # a repository secret (which would also make it unavailable to fork PRs).
  smb-doctor:
    name: Doctor against a real Samba server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rewrites the runner's smb.conf, adds an account, restarts smbd, and
    # kernel-mounts CIFS under passwordless sudo -- the same class of host
    # control as chroot-native, so like it, not exposed to fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      SMB_TEST_USER: runner
      SMB_TEST_PASSWORD: alcove-ci-throwaway
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build CLI
        run: npm run build -w apps/cli

      # apt applies no network timeout of its own, so a mirror connection that
      # goes quiet hangs the install below with nothing to time it out.
      - name: Bound apt network stalls
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-ci-retry

      # A mirror that trickles rather than falls silent keeps the timeouts above
      # from ever firing, so bound the step itself rather than relying on the
      # job-level ceiling alone.
      - name: Start a Samba server with a writable and a read-only share
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samba smbclient cifs-utils
          sudo mkdir -p /srv/alcove/dropbox /srv/alcove-readonly
          sudo chown -R "$SMB_TEST_USER":"$SMB_TEST_USER" /srv/alcove /srv/alcove-readonly
          sudo tee /etc/samba/smb.conf >/dev/null <<CONF
          [global]
            workgroup = WORKGROUP
            security = user
            server min protocol = SMB2
            log level = 1
            interfaces = 127.0.0.1
            bind interfaces only = yes

          [exchange]
            path = /srv/alcove
            read only = no
            valid users = $SMB_TEST_USER

          [readonly]
            path = /srv/alcove-readonly
            read only = yes
            valid users = $SMB_TEST_USER
          CONF
          printf '%s\n%s\n' "$SMB_TEST_PASSWORD" "$SMB_TEST_PASSWORD" |
            sudo smbpasswd -s -a "$SMB_TEST_USER"
          sudo systemctl restart smbd
          # Fail with a clear message rather than letting every check below report
          # an unreachable server.
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/445) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "smbd did not begin listening on 445" >&2
          sudo systemctl status smbd --no-pager || true
          exit 1

      - name: Probe a healthy file drop
        run: |
          set -euo pipefail
          export SMB_SERVER=127.0.0.1 SMB_SHARE=exchange SMB_PATH=dropbox
          export SMB_USER="$SMB_TEST_USER" SMB_PASS="$SMB_TEST_PASSWORD"
          export SMB_MARKER=alcove-check.txt SMB_TOKEN=healthyrun
          verdict=$(node apps/cli/dist/index.js doctor probe --json)
          echo "$verdict" | jq .
          echo "$verdict" | jq -e '.version == 1 and .mode == "probe" and .overall == "ok"'
          echo "$verdict" | jq -e '[.checks[] | select(.status != "ok")] | length == 0'
          # The probe removes every file it creates except the marker, which the
          # mount checks are meant to find.
          grep -qx healthyrun /srv/alcove/dropbox/alcove-check.txt
          test "$(ls -A /srv/alcove/dropbox | wc -l)" = 1

      - name: Probe with a pinned dialect
        run: |
          set -euo pipefail
          # Both halves of the dialect pin are exercised against the real client:
          # -m alone would be a contradiction the client rejects outright.
          export SMB_SERVER=127.0.0.1 SMB_SHARE=exchange SMB_PATH=dropbox
          export SMB_USER="$SMB_TEST_USER" SMB_PASS="$SMB_TEST_PASSWORD"
          for dialect in SMB3 SMB2; do
            SMB_DIALECT="$dialect" node apps/cli/dist/index.js doctor probe --json |
              jq -e '.overall == "ok"' >/dev/null ||
              { echo "pinned dialect $dialect did not pass"; exit 1; }
          done

      - name: Probe staged failures
        run: |
          set -euo pipefail
          export SMB_SERVER=127.0.0.1 SMB_SHARE=exchange SMB_PATH=dropbox
          export SMB_USER="$SMB_TEST_USER" SMB_PASS="$SMB_TEST_PASSWORD"

          # Each case asserts the exit code AND which check failed: a verdict that
          # blames the wrong step is exactly the failure this command exists to
          # prevent, and an exit code alone cannot catch it.
          expect() {
            local label="$1" expected_exit="$2" filter="$3"
            set +e
            verdict=$(node apps/cli/dist/index.js doctor probe --json)
            local code=$?
            set -e
            echo "--- $label: exit $code"
            echo "$verdict" | jq .
            if [ "$code" != "$expected_exit" ]; then
              echo "$label: expected exit $expected_exit, got $code" >&2
              exit 1
            fi
            if ! echo "$verdict" | jq -e "$filter" >/dev/null; then
              echo "$label: verdict did not satisfy $filter" >&2
              exit 1
            fi
          }

          ( export SMB_PASS=definitely-not-the-password
            expect "bad password" 78 \
              '.overall == "fix_and_retry"
               and (.checks[] | select(.id == "authentication") | .status == "fail")
               and (.checks[] | select(.id == "write") | .status == "skipped")' )

          ( export SMB_SHARE=no-such-share
            expect "nonexistent share" 78 \
              '.checks[] | select(.id == "share_open") | .status == "fail"' )

          ( export SMB_PATH=no-such-folder
            expect "nonexistent subdirectory" 78 \
              '(.checks[] | select(.id == "share_open") | .status == "ok")
               and (.checks[] | select(.id == "subdirectory") | .status == "fail")' )

          # SMB_PATH is handed to smbclient as -D's own argv element, so a
          # dash-leading or option-shaped value must be read as a folder name,
          # never as an option. Only the real client can prove that; the right
          # answer for both is the nonexistent-subdirectory verdict.
          ( export SMB_PATH=-dashfolder
            expect "dash-leading subdirectory" 78 \
              '(.checks[] | select(.id == "share_open") | .status == "ok")
               and (.checks[] | select(.id == "subdirectory") | .status == "fail")' )

          ( export SMB_PATH="--option=client min protocol=NT1"
            expect "option-shaped subdirectory" 78 \
              '(.checks[] | select(.id == "share_open") | .status == "ok")
               and (.checks[] | select(.id == "subdirectory") | .status == "fail")' )

          ( export SMB_SHARE=readonly
            unset SMB_PATH
            expect "read-only share" 78 \
              '(.checks[] | select(.id == "authentication") | .status == "ok")
               and (.checks[] | select(.id == "share_open") | .status == "ok")
               and (.checks[] | select(.id == "write") | .status == "fail")
               and (.checks[] | select(.id == "write") | .action | test("write permission"))' )

          # A documentation-range address with nothing behind it: the run stops at
          # reachability, before any credential is sent. Not a loopback address --
          # smbd binds every interface, so any 127.x would answer.
          ( export SMB_SERVER=192.0.2.1
            expect "unreachable port 445" 78 \
              '(.checks[] | select(.id == "tcp_445") | .status == "fail")
               and (.checks[] | select(.id == "authentication") | .status == "skipped")' )

      - name: Probe reports failures in the human rendering too
        run: |
          set -euo pipefail
          export SMB_SERVER=127.0.0.1 SMB_SHARE=exchange SMB_PATH=dropbox
          export SMB_USER="$SMB_TEST_USER" SMB_PASS=definitely-not-the-password
          set +e
          node apps/cli/dist/index.js doctor probe >stdout.log 2>human.log
          code=$?
          set -e
          cat human.log
          test "$code" = 78
          # The default rendering is what an operator reads, so it has to carry the
          # remedy, not just the verdict.
          grep -q "FAIL: NT_STATUS_LOGON_FAILURE" human.log
          grep -q "MEANING:" human.log
          grep -q "ACTION:" human.log
          # Without --json the check lines are diagnostics, so stdout stays empty
          # and a caller cannot half-parse it.
          test ! -s stdout.log
          rm -f human.log stdout.log

      - name: Check the mount through a Docker CIFS volume
        run: |
          set -euo pipefail
          export SMB_SERVER=127.0.0.1 SMB_SHARE=exchange SMB_PATH=dropbox
          export SMB_USER="$SMB_TEST_USER" SMB_PASS="$SMB_TEST_PASSWORD"
          export SMB_MARKER=alcove-check.txt SMB_TOKEN=volumerun
          node apps/cli/dist/index.js doctor probe --json | jq -e '.overall == "ok"'

          # The production shape the Windows setup script creates: a local-driver
          # cifs volume whose device is //server/share/subpath, mounted by the
          # daemon on the host. The container running the check is a stock node
          # image with the repo bind-mounted rather than the Alcove image, so this
          # job does not also build that image (image_smoke.yaml does); the volume,
          # which is what this leg exists to exercise, is identical either way.
          docker volume create --driver local --opt type=cifs \
            --opt device="//127.0.0.1/exchange/dropbox" \
            --opt o="username=$SMB_TEST_USER,password=$SMB_TEST_PASSWORD,vers=3.1.1,uid=$(id -u),gid=$(id -g),file_mode=0777,dir_mode=0777" \
            alcove-doctor-volume
          verdict=$(docker run --rm \
            -v alcove-doctor-volume:/rz -v "$PWD":/repo -w /repo \
            -e SMB_MARKER -e SMB_TOKEN \
            node:26 node apps/cli/dist/index.js doctor mount /rz --json)
          echo "$verdict" | jq .
          echo "$verdict" | jq -e '.version == 1 and .mode == "mount" and .overall == "ok"'
          echo "$verdict" | jq -e '[.checks[] | select(.status != "ok")] | length == 0'
          # The two halves agreed on the directory, and the mount checks own the
          # marker's lifecycle, so it is consumed and nothing is left behind.
          test "$(ls -A /srv/alcove/dropbox | wc -l)" = 0
          docker volume rm alcove-doctor-volume

      - name: Check the mount through a kernel CIFS mount
        run: |
          set -euo pipefail
          export SMB_SERVER=127.0.0.1 SMB_SHARE=exchange SMB_PATH=dropbox
          export SMB_USER="$SMB_TEST_USER" SMB_PASS="$SMB_TEST_PASSWORD"
          export SMB_MARKER=alcove-check.txt SMB_TOKEN=kernelrun
          node apps/cli/dist/index.js doctor probe --json | jq -e '.overall == "ok"'

          sudo mkdir -p /mnt/alcove
          sudo mount -t cifs //127.0.0.1/exchange/dropbox /mnt/alcove \
            -o "username=$SMB_TEST_USER,password=$SMB_TEST_PASSWORD,vers=3.1.1,uid=$(id -u),gid=$(id -g)"
          verdict=$(node apps/cli/dist/index.js doctor mount /mnt/alcove --json)
          echo "$verdict" | jq .
          echo "$verdict" | jq -e '.overall == "ok"'
          echo "$verdict" | jq -e '.checks[] | select(.id == "marker") | .status == "ok"'

          # A mount pointing at a different directory is the case the marker exists
          # to catch, so it is staged rather than assumed.
          sudo mkdir -p /srv/alcove/elsewhere /mnt/alcove-elsewhere
          sudo chown "$SMB_TEST_USER":"$SMB_TEST_USER" /srv/alcove/elsewhere
          sudo mount -t cifs //127.0.0.1/exchange/elsewhere /mnt/alcove-elsewhere \
            -o "username=$SMB_TEST_USER,password=$SMB_TEST_PASSWORD,vers=3.1.1,uid=$(id -u),gid=$(id -g)"
          set +e
          verdict=$(node apps/cli/dist/index.js doctor mount /mnt/alcove-elsewhere --json)
          code=$?
          set -e
          echo "$verdict" | jq .
          test "$code" = 78
          echo "$verdict" | jq -e '.checks[] | select(.id == "marker") | .status == "fail"'

          # A directory that is not mounted at all is fatal, not a verdict about
          # the share, and carries its own exit code.
          set +e
          verdict=$(node apps/cli/dist/index.js doctor mount /mnt/alcove-absent --json)
          code=$?
          set -e
          test "$code" = 69
          echo "$verdict" | jq -e '.overall == "fatal"'

          sudo umount /mnt/alcove /mnt/alcove-elsewhere
