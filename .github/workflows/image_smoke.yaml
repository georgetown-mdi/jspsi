name: Image Smoke

# Smoke test for the container images this repository ships: the default CLI +
# web-console appliance image and the FIPS variant (Dockerfile.fips), both of
# which release.yaml builds, scans, signs, and publishes at a version tag. This
# is the sole pre-merge check that either image actually builds and that both
# of its roles run: the headless CLI and the `serve` web console.
#
# It builds single-arch (native amd64, no QEMU) and loads each image into the
# runner's Docker so it can run it -- deliberately faster and simpler than the
# release job's multi-arch build+push, since nothing is published here.
#
# A second job drives the restricted-egress recipe docs/DEPLOYMENT.md hands the
# operator. It needs Docker and root on the same machine, which is what puts it
# here rather than anywhere else, and its own comment carries the rest.
#
# The pull-request trigger is scoped by path to changes that can affect an
# image. If this is made a required status check, configure branch protection so
# a path-skipped run does not block an unrelated PR -- a skipped required check
# otherwise stays pending.
on:
  # An on-demand run: how a maintainer re-checks the images after bumping the
  # base digest, without waiting for the schedule or opening a pull request.
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
    paths:
      - "Dockerfile"
      - "Dockerfile.fips"
      - "openssl-fips-only.cnf"
      - "docker-entrypoint.sh"
      - "docker-entrypoint-fips.sh"
      - ".dockerignore"
      - "apps/**"
      - "packages/**"
      - "lib/**"
      - "package-lock.json"
      # The builder copies the root .npmrc and package.json in beside the
      # lockfile, so the install policy the one states and the allowScripts map
      # the other carries are image build inputs on the same footing: a flag
      # interaction, an added registry, or a verdict change that only breaks the
      # containerised install would otherwise surface first at a release tag.
      - ".npmrc"
      - "package.json"
      # The FIPS leg runs both harnesses out of this directory.
      - "support/fips-probe/**"
      # The file-drop setup and launcher scripts delegate every check they make
      # to a capability of the image, and the capability step below exercises
      # what they invoke against the image this job builds. The edit that can
      # break that gate is a support-script edit, so it has to be inside the
      # trigger; the two scripts beside it derive the set and drive the runs.
      - "support/windows-network-filedrop/**"
      - "scripts/derive-image-dependencies.mjs"
      - "scripts/assert-image-capabilities.mjs"
      # Both legs run a real exchange over these two synthetic inputs, so a
      # change to their schema breaks it here rather than in a release build.
      - "test_data/**"
      - ".github/workflows/image_smoke.yaml"
      # The exception list the vulnerability scan below reads.
      - ".github/trivyignore.yaml"
  # Weekly re-run against a refreshed vulnerability database. The base images
  # are pinned by digest, so a vulnerability published against one of them
  # reaches an operator with nothing in this repository changed -- no path above
  # matches, and no other trigger fires. Monday, matching the Dependabot cadence
  # in .github/dependabot.yml, as codeql.yaml does for the same reason.
  schedule:
    - cron: "45 5 * * 1"

# Cancel a superseded run when a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege at the top level; the smoke job widens to what the scan's
# SARIF upload needs.
permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke the ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    permissions:
      # actions/checkout.
      contents: read
      # Upload the vulnerability scan's SARIF as code-scanning alerts.
      security-events: write
    # The FIPS leg's exchange step runs a real two-party exchange over a polled
    # file drop, so this bound is well above the default-image leg's needs.
    timeout-minutes: 60
    strategy:
      # One image failing to build says nothing about the other, and the FIPS
      # leg's findings are the more expensive to re-run.
      fail-fast: false
      matrix:
        include:
          - variant: default
            dockerfile: Dockerfile
            tag: psi-link:smoke
            fips: "false"
          - variant: fips
            dockerfile: Dockerfile.fips
            tag: psi-link:fips-smoke
            fips: "true"
    steps:
      - uses: actions/checkout@v7

      # The capability assertion below runs on the runner's Node, not in the
      # image, so it needs the version this repository requires (package.json
      # engines) rather than whatever the runner image happens to ship. The
      # script is dependency-free, so a plain pinned Node suffices -- no npm ci
      # or @psilink/core build (the ./.github/actions/setup prologue) needed.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # The image COPYs the vendored @openmined/psi.js tarball (a file:
      # dependency, whose lockfile sha512 integrity covers what npm installs
      # from cache rather than the file copied in) and installs it; verify the
      # committed sha256 of the bytes in the tree before the build, mirroring
      # the release job.
      - name: Verify vendored native tarball integrity
        run: sha256sum -c lib/openmined-psi.js-*.tgz.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single-arch, load into the runner's Docker so the smoke steps can run
      # it. No push, no QEMU, no multi-arch -- that is the release job's
      # concern. The cache is scoped per variant: the two images share no layer,
      # so one scope would have them evicting each other.
      - name: Build image (amd64, load into local Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # Both published images run unprivileged, and every other step here would
      # pass just as happily as uid 0 -- so a dropped or widened USER line is
      # invisible to all of them and needs its own assertion. The uid is not
      # merely non-zero but the exact one docs/DEPLOYMENT.md tells operators to
      # chown a bind mount to, and it is the same pair on both legs: the default
      # image inherits the account from node:26-alpine, the variant creates it,
      # Amazon Linux 2023 carrying none. dockerfile-freeze.test.mjs holds the
      # instructions behind it on both images.
      - name: Smoke the container's identity
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id ${{ matrix.tag }} -u)
          gid=$(docker run --rm --entrypoint id ${{ matrix.tag }} -g)
          echo "the image runs as uid $uid, gid $gid"
          if [ "$uid" != 1000 ] || [ "$gid" != 1000 ]; then
            echo "expected uid 1000 and gid 1000, the pair docs/DEPLOYMENT.md documents" >&2
            exit 1
          fi

      # What the image hands the account it runs as, measured on the built image
      # rather than read off the instruction that declares it. The runtime stage
      # gives that account /work and the console's credential scratch directory
      # and withholds /app, so the process reads and executes its own code
      # without being able to rewrite it; dockerfile-freeze.test.mjs holds the
      # instruction, and only a run reaches what the instruction produced on top
      # of whatever the base image already did.
      #
      # Probed by writing rather than by `test -w`: a mode that reads as writable
      # over a layer or a mount that refuses the write is the case a stat cannot
      # tell apart. The /app walk is the other half -- a file the account owns,
      # or one any group it carries can write, is code it can rewrite in place
      # without /app itself ever being writable -- and it runs as uid 0 so no
      # directory mode can hide a path from it, ownership and mode being facts
      # about the image either way.
      #
      # The walk skips symlinks. Linux has no chmod for a symlink: its own mode
      # is 0777 and grants nothing, so `-perm`, which tests the lstat mode,
      # matches every link in the image while saying nothing about rewriting.
      # Re-pointing a link takes write permission on the directory holding it,
      # which the walk already reaches through that directory itself.
      - name: Measure the container's writable set
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh ${{ matrix.tag }} -c '
            set -eu
            for tree in /work /run/psilink/sftp-credentials
            do
              probe="$tree/.write-probe.$$"
              if ! touch "$probe"; then
                echo "$tree is not writable by the account the image runs as" >&2
                exit 1
              fi
              rm -f "$probe"
              echo "$tree: writable"
            done
            if touch "/app/.write-probe.$$" 2>/dev/null; then
              rm -f "/app/.write-probe.$$"
              echo "/app is writable by the account the image runs as" >&2
              exit 1
            fi
            echo "/app: not writable"
          '

          reachable=$(docker run --rm --user 0 --entrypoint sh ${{ matrix.tag }} -c '
            set -eu
            echo "the runtime account is uid $(id -u node), in groups $(id -Gn node)" >&2
            set -- -user "$(id -u node)" -o -perm -0002
            for gid in $(id -G node)
            do
              set -- "$@" -o -group "$gid"
            done
            find /app ! -type l \( "$@" \) -print
          ')
          if [ -n "$reachable" ]; then
            count=$(printf '%s\n' "$reachable" | wc -l)
            echo "$count paths under /app are owned by, or writable by, the account the image runs as; the first of them:" >&2
            printf '%s\n' "$reachable" | head -n 40 >&2
            exit 1
          fi
          echo "/app: no path owned by that account or by a group it carries, and none other-writable"

      # The step above skips symlinks for the reason given there; this pass
      # closes the gap that leaves: a symlink under /app whose target
      # resolves into a tree the runtime account can write (/work, for
      # instance) is code that account can effectively rewrite without
      # owning, or being granted write on, anything the walk measures.
      #
      # Resolved with `readlink -f`, not `realpath`: on a dangling relative
      # target, `realpath` can resolve against the process CWD and fabricate
      # an escape that does not exist. `readlink -f`'s result for that same
      # case is never trusted on its own -- it is only ever read alongside
      # the `[ -e ]` guard below. What actually classifies a dangling link
      # correctly is the step's own construction: it never changes
      # directory, so every command here runs at the image's WORKDIR, /work,
      # which is empty in this ephemeral container, so a CWD-relative
      # resolution of a dangling target has nothing there to resolve to and
      # fails `[ -e ]`, and the guard buckets it as dangling rather than
      # reading it as an escape.
      - name: Measure the container's symlink containment
        run: |
          set -euo pipefail
          docker run --rm --user 0 --entrypoint sh ${{ matrix.tag }} -c '
            set -eu
            offenders=$(
              find /app -type l | while IFS= read -r link; do
                target=$(readlink "$link")
                if resolved=$(readlink -f "$link" 2>/dev/null) && [ -e "$resolved" ]; then
                  case "$resolved" in
                    /app|/app/*) ;;
                    *) echo "escapes /app: $link -> $target (resolves to $resolved)" ;;
                  esac
                else
                  echo "dangling: $link -> $target"
                fi
              done
            )
            if [ -n "$offenders" ]; then
              echo "one or more symlinks under /app do not resolve inside /app:" >&2
              printf "%s\n" "$offenders" >&2
              exit 1
            fi
            echo "/app: every symlink resolves inside /app, none dangling"
          '

      # Role 1: the headless CLI still runs. `--help` is a read-only invocation
      # that exits 0 (no exchange, no key material, no network).
      - name: Smoke the CLI role
        run: docker run --rm ${{ matrix.tag }} --help

      # Role 1, for real: an invitation, an acceptance, and both halves of an
      # exchange over a shared folder, every command in a container running as
      # the unprivileged user. `--help` proves nothing about the change this
      # guards -- writing does. /work is an operator-supplied bind mount that
      # carries its HOST ownership into the container, so the result CSV and the
      # rotated key file land only if the ownership docs/DEPLOYMENT.md asks a
      # Linux operator for is the ownership the image actually needs; the chown
      # below is that documented step, performed literally.
      #
      # single-pass keeps the round-trip count constant instead of one round per
      # linkage key, which is what keeps this to seconds; the strategy is a
      # consented disclosure tradeoff, and these are synthetic inputs.
      #
      # The default leg's alone because the variant has an end-to-end exchange of
      # its own below, over the same chowned bind mounts; a second copy of this
      # one would measure nothing the pair does not.
      - name: Smoke the CLI role over a writable bind mount
        if: matrix.fips == 'false'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cli-smoke"
          mkdir -p "$work/inviter" "$work/acceptor" "$work/drop"
          cp test_data/fake_data_1.csv "$work/inviter/input.csv"
          cp test_data/fake_data_2.csv "$work/acceptor/input.csv"
          # The parent stays the runner's, so the steps below can still stat what
          # the container writes; the mounts themselves go to the image's uid.
          sudo chown -R 1000:1000 "$work/inviter" "$work/acceptor" "$work/drop"

          # Both parties' configuration is written with an SFTP placeholder
          # connection block. This replaces that block with the shared folder,
          # and runs in the image because the file it edits belongs to the
          # container's user rather than to this runner.
          printf '%s\n' \
            '/^connection:/ { print "connection:"; print "  channel: filedrop"; print "  path: /drop"; skip = 1; next }' \
            'skip && /^[ \t]/ { next }' \
            '{ skip = 0; print }' \
            > "$work/repoint.awk"
          repoint() {
            docker run --rm \
              -v "$work/$1":/work -v "$work/repoint.awk":/repoint.awk:ro \
              --entrypoint sh ${{ matrix.tag }} -c '
                set -e
                awk -f /repoint.awk /work/psilink.yaml > /work/psilink.yaml.repointed
                mv /work/psilink.yaml.repointed /work/psilink.yaml
                chmod 600 /work/psilink.yaml
              '
          }
          cli() {
            local party="$1"
            shift
            docker run --rm \
              -v "$work/$party":/work -v "$work/drop":/drop \
              ${{ matrix.tag }} "$@"
          }

          # The invitation is the command's stdout. Its stderr log repeats the
          # whole invitation -- the shared secret with it -- in the "your partner
          # accepts with" line, and this job's log is public, so that stream goes
          # to a file beside the mounts instead of into the log. On a failure the
          # step reports the exit status and the size of what it held back:
          # printing the file would put the invitation in the public log exactly
          # as capturing the stream would have, so a failing invite is diagnosed
          # from the status and the shape of its output, and reproduced locally.
          invite_stderr="$work/invite.stderr"
          invite_status=0
          invitation=$(cli inviter invite input.csv --linkage-strategy single-pass \
            --identity "CI Smoke Inviter" 2>"$invite_stderr") || invite_status=$?
          if [ "$invite_status" != 0 ]; then
            echo "invite exited $invite_status" >&2
            echo "it wrote ${#invitation} bytes to stdout, and $(wc -c <"$invite_stderr") bytes over $(wc -l <"$invite_stderr") lines to stderr, withheld here because that stream repeats the invitation" >&2
            exit 1
          fi
          repoint inviter
          key_before=$(sudo sha256sum "$work/inviter/.psilink.key" | cut -d " " -f 1)

          cli acceptor accept "$invitation" input.csv --consent-to-terms --identity "CI Smoke Acceptor"
          repoint acceptor

          inviter_cid=$(docker run -d \
            -v "$work/inviter":/work -v "$work/drop":/drop \
            ${{ matrix.tag }} exchange input.csv output.csv --polling-frequency 1s)
          acceptor_cid=$(docker run -d \
            -v "$work/acceptor":/work -v "$work/drop":/drop \
            ${{ matrix.tag }} exchange input.csv output.csv --polling-frequency 1s)
          echo "started exchange halves $inviter_cid and $acceptor_cid"

          # Each half waits for the other, so both must be running before either
          # can finish; the timeout keeps a stalled rendezvous from hanging the job.
          inviter_rc=$(timeout 300 docker wait "$inviter_cid" || echo timed-out)
          acceptor_rc=$(timeout 300 docker wait "$acceptor_cid" || echo timed-out)
          docker logs "$inviter_cid" || true
          docker logs "$acceptor_cid" || true
          docker rm -f "$inviter_cid" "$acceptor_cid" >/dev/null 2>&1 || true
          if [ "$inviter_rc" != 0 ] || [ "$acceptor_rc" != 0 ]; then
            echo "an exchange half did not exit 0 (inviter=$inviter_rc, acceptor=$acceptor_rc)" >&2
            exit 1
          fi

          # The owner-only write path, under the non-root uid: every file the
          # exchange left in either party's own bind mount is mode 0600 and
          # belongs to that uid. Each mount is walked rather than a list of names
          # checked, so an artifact the CLI gains later -- a record, a key
          # sidecar -- is covered without editing this step, and each is required
          # to be non-empty on its own, so a run where only one half wrote
          # anything fails here rather than passing on the other's files.
          #
          # The third mount, the shared drop directory, is deliberately outside
          # the walk: it is the partner-visible transfer folder, and no
          # confidentiality claim rests on the modes of what lands there.
          #
          # Two names are skipped inside the two walked mounts. input.csv is the
          # file this step placed there itself. psilink.yaml is excluded because
          # its mode here would be this step's own doing rather than the image's:
          # the repoint above rewrites the file through a shell redirect, which
          # creates it at the container's umask, and then chmods the result to
          # 600 -- so the assertion would attest that chmod. The CLI writes the
          # config owner-only itself (writeFileOwnerOnly, apps/cli/src/config.ts).
          for party in inviter acceptor
          do
            artifacts=$(sudo find "$work/$party" -type f \
              ! -name input.csv ! -name psilink.yaml | sort)
            if [ -z "$artifacts" ]; then
              echo "the exchange left no files in the $party bind mount" >&2
              exit 1
            fi
            while IFS= read -r artifact
            do
              mode=$(sudo stat -c "%a" "$artifact")
              owner=$(sudo stat -c "%u" "$artifact")
              echo "${artifact#"$work"/}: mode $mode, owner uid $owner"
              if [ "$mode" != 600 ] || [ "$owner" != 1000 ]; then
                echo "${artifact#"$work"/} must be mode 600 owned by uid 1000" >&2
                exit 1
              fi
            done <<< "$artifacts"
          done

          # The rotated token is written back after a successful exchange, so a
          # mount the container user cannot write would fail here even though the
          # exchange itself had already succeeded.
          key_after=$(sudo sha256sum "$work/inviter/.psilink.key" | cut -d " " -f 1)
          if [ "$key_before" = "$key_after" ]; then
            echo "the rotated token was not written back to the bind mount" >&2
            exit 1
          fi

      # Role 2: the web console server comes up and serves. Start it detached in
      # `serve` mode, poll the root URL until it answers HTTP 200 within a bounded
      # timeout, then tear the container down. Both exits -- the timeout-failure
      # branch (after dumping logs) and the success fall-through -- remove the
      # container by hand; there is no separate teardown step to rely on.
      #
      # JOB_DATA_ROOT turns the job API on, which is what makes this a smoke of
      # the console appliance rather than of the web UI alone: enabling it puts
      # the fail-closed credential-scratch setup in the startup path, and that
      # setup writes under root-owned /run. The server is unprivileged on both
      # images and refuses to boot there unless the image prepared the directory
      # for it, so this step times out rather than answering when it did not.
      #
      # The data mount goes to uid 1000 for the same reason: it is the account
      # both images write as.
      - name: Smoke the serve role
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/serve-smoke"
          mkdir -p "$data"
          sudo chown 1000:1000 "$data"
          # Published on the loopback interface alone: the probe below reaches it
          # at 127.0.0.1, so nothing needs the runner's other interfaces to carry
          # a console with the job API enabled.
          cid=$(docker run -d -p 127.0.0.1:3000:3000 \
            --env JOB_DATA_ROOT=/data -v "$data":/data \
            ${{ matrix.tag }} serve)
          echo "started server container $cid"

          ok=false
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "server answered HTTP 200 on attempt $attempt"
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "server did not answer HTTP 200 within the timeout" >&2
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f "$cid" >/dev/null 2>&1 || true

      # The Windows file-drop setup scripts run their SMB probe inside this
      # image, so the smbclient the runtime stage installs is load-bearing for
      # that setup path: the probe checks for it and stops before it reaches the
      # share when it is missing, so an image published without it strands that
      # setup entirely. `command -v` resolves it from PATH and needs no network
      # and no server. It is `apk add samba-client` on the default image and
      # `dnf install samba-client` on the variant; this assertion is the same on
      # both. The entrypoint is overridden because it dispatches its argv to the
      # CLI, as the setup scripts override it for the same reason.
      - name: Smoke the file-drop probe tooling
        run: docker run --rm --entrypoint sh ${{ matrix.tag }} -c 'command -v smbclient'

      # Everything else those setup scripts ask of the image, read out of the
      # scripts rather than listed beside them: the psilink argument vectors they
      # hand a container, and the helper scripts they pipe into a shell in it.
      # Each is exercised -- the vector is run and its verdict read back, the
      # helper is piped in as the `.cmd` pipes it -- so the in-image tools a
      # helper needs are resolved by the run rather than enumerated anywhere, and
      # a derived dependency with nothing to exercise it fails the run.
      #
      # Against the image this job just built, which is the right subject for the
      # launchers: they ship stamped with a release's manifest digest, so their
      # image is locked to the commit they were built from and a script that
      # outruns the source tree in the same pull request is caught here. It is
      # the wrong subject for Setup-PsilinkFileDrop.ps1, which is fetched off the
      # default branch on its own and runs the floating tag -- the published job
      # below is that half.
      #
      # Scoped to the default image: it is the one the scripts name, its tags
      # being the unsuffixed ones they pull, and the only one whose package
      # closure their helper scripts were written against.
      - name: Assert the built image answers what the setup scripts invoke
        if: matrix.fips == 'false'
        run: node scripts/assert-image-capabilities.mjs ${{ matrix.tag }}

      # The variant's entrypoint preamble runs the engagement probe and reports
      # the host kernel's FIPS mode on every run. An operator's only cheap
      # window into what their deployment is actually running, so a preamble
      # that silently stopped reporting would be a real regression. The
      # "FIPS provider active" line is written only on a zero exit from the
      # probe, so this grep is also the assertion that the probe ships in the
      # image and runs there: a missing file or a broken import warns instead.
      - name: Smoke the FIPS entrypoint report
        if: matrix.fips == 'true'
        run: |
          set -euo pipefail
          docker run --rm ${{ matrix.tag }} --help >entrypoint.out 2>&1
          cat entrypoint.out
          grep -q 'FIPS provider active' entrypoint.out
          grep -q 'host kernel' entrypoint.out

      # Does the configuration the image SHIPS engage the provider? The probe in
      # the step below answers a stronger question but answers it about
      # configurations it writes itself, so it cannot answer this one.
      # `crypto.getFips()` is no substitute: it returns 1 with no module loaded
      # at all. This runs the copy INSIDE the image -- the same file the
      # entrypoint runs at every container start, rather than a mounted one that
      # could differ from it -- and it fails unless fips.so is mapped into the
      # process, the five psilink call shapes (AES-256-GCM, HKDF-SHA-256,
      # HMAC-SHA-256, SHA-256, P-256 ECDH) all succeed, and both an MD5 digest
      # and a below-minimum RSA keygen -- which no FIPS provider serves -- fail
      # beside them. The step above reads the same verdict through the exit
      # status; this one is what puts the per-leg JSON transcript in the run log.
      - name: Assert the shipped configuration engages the FIPS provider
        if: matrix.fips == 'true'
        run: |
          docker run --rm \
            --entrypoint node ${{ matrix.tag }} /app/fips-probe/image-engagement.mjs

      # The four-leg attribution, including the causal controls the step above
      # deliberately does not run: the provider is broken (its config MAC
      # corrupted, then its module truncated) and the same AES call re-run, so a
      # success that never depended on the provider is caught. The harness wants
      # a prefix laid out as $PREFIX/lib/ossl-modules/fips.so and
      # $PREFIX/ssl/fipsmodule.cnf; Amazon Linux 2023 ships no fipsmodule.cnf
      # and its `openssl fipsinstall` is disabled, so the stand-in carries only
      # the section header and no module-mac line. The harness reports its own
      # S4a break ineffective on that basis and grades on S4b instead, which is
      # what it is designed to do. It exits 0 whatever it measures, so the
      # verdict is read from PROBE_JSON rather than from the exit status.
      - name: Attribute the engagement with causal controls
        if: matrix.fips == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/support/fips-probe:/probe:ro" \
            -e PROBE_PREFIX=/tmp/probe-prefix \
            -e PROBE_TMP=/tmp/probe-tmp \
            -e PROBE_OPENSSL_TAG=amzn2023-cert5021 \
            --entrypoint sh ${{ matrix.tag }} -c '
              set -eu
              mkdir -p "$PROBE_PREFIX/lib/ossl-modules" "$PROBE_PREFIX/ssl" "$PROBE_TMP"
              ln -s "$OPENSSL_MODULES/fips.so" "$PROBE_PREFIX/lib/ossl-modules/fips.so"
              printf "[fips_sect]\nactivate = 1\n" >"$PROBE_PREFIX/ssl/fipsmodule.cnf"
              exec node /probe/webcrypto-probe.mjs
            ' >probe.out 2>&1 || true
          grep -F 'PROBE_JSON:' probe.out || { cat probe.out; exit 1; }
          if ! grep -qF '"verdict":"ENGAGED"' probe.out; then
            echo "the FIPS engagement probe did not reach an ENGAGED verdict" >&2
            cat probe.out >&2
            exit 1
          fi

      # A full two-party exchange inside the built variant: two containers of
      # the image, a working directory each, and one shared volume they drop
      # files into. This is the only end-to-end run either image gets -- every
      # other step here starts a process and asks it a question -- and it is
      # what would catch a FIPS configuration that engages the provider and then
      # denies the exchange an algorithm it needs partway through.
      #
      # `--linkage-strategy single-pass` for the round count, not the strategy:
      # measured against this drop transport, the default cascade's twelve
      # polled rounds take 5m36s to the single pass's 40s, and both run the same
      # handshake, AEAD, key schedule and PSI code.
      #
      # SFTP is deliberately not exercised: the variant cannot reach a server
      # offering only curve25519 key exchange, which is a documented limitation
      # rather than a regression (docs/notes/fips-variant-image.md).
      #
      # No `--identity` on either party, deliberately: the quick path asks
      # nothing and requires nothing, so this run is the standing check that it
      # completes for a party that names itself none. The invite/accept step
      # above passes one, because those legs do require it.
      - name: Run a full exchange end-to-end in the image
        if: matrix.fips == 'true'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/a" "$work/b" "$work/share"
          cp test_data/fake_data_1.csv "$work/a/input.csv"
          cp test_data/fake_data_2.csv "$work/b/input.csv"
          # The bind mounts carry their host ownership into the container and the
          # image runs as uid 1000, so this is the chown docs/DEPLOYMENT.md asks
          # a Linux operator for, performed literally. The parent stays the
          # runner's, so the steps below can still stat what the containers wrote.
          sudo chown -R 1000:1000 "$work/a" "$work/b" "$work/share"

          for party in a b; do
            docker run -d --name "exchange-$party" \
              -v "$work/$party:/work" -v "$work/share:/share" \
              ${{ matrix.tag }} \
              --linkage-strategy single-pass file:///share input.csv output.csv
          done

          codes=$(timeout 900 docker wait exchange-a exchange-b || true)
          echo "party exit codes: $codes"
          for party in a b; do
            echo "--- party $party ---"
            docker logs "exchange-$party" 2>&1 || true
          done
          docker rm -f exchange-a exchange-b >/dev/null 2>&1 || true

          if [ "$codes" != "$(printf '0\n0')" ]; then
            echo "an exchange party did not exit 0" >&2
            exit 1
          fi

          # Both parties write the same intersection, so a run that "succeeded"
          # while linking nothing is caught here rather than passing on exit 0.
          #
          # Counted from inside a container rather than on the runner: the CLI
          # writes the result CSV owner-only (createOwnerOnlyWriteStream), so the
          # bind mount puts a uid-1000 0600 file in front of a runner shell that
          # is neither. Reading it back through the image preserves the mode the
          # image actually ships with, where running the parties as the runner's
          # uid would smoke something other than the published image. The default
          # leg's bind-mount step above reads its artifacts with sudo for the
          # same reason.
          for party in a b; do
            lines=$(docker run --rm -v "$work/$party:/work:ro" \
              --entrypoint sh ${{ matrix.tag }} -c 'wc -l </work/output.csv')
            echo "party $party wrote $lines lines of results"
            if [ "$lines" != "11" ]; then
              echo "party $party wrote $lines lines, expected 11 (a header and ten matched rows)" >&2
              exit 1
            fi
          done

      # Every setuid and setgid file in the built image, compared against the
      # inventory docs/spec/CONTAINER_IMAGES.md records for it. No reading of a
      # Dockerfile reaches these: the bits come from base-image state and from an
      # OS package's own file modes, so the instruction text says nothing about
      # them either way.
      #
      # Run as uid 0 on both legs. The inventory is a property of the image's
      # filesystem rather than of what the runtime account can see, and a
      # traversal under an unprivileged account cannot enter a root-only
      # directory -- it would report an absence it never measured.
      #
      # After the functional smokes on purpose: a failing step skips every step
      # after it, and an inventory that has drifted is worth less than the
      # variant's provider assertions and its end-to-end exchange, which have to
      # keep running while the drift is diagnosed. The vulnerability scan below
      # sits after this one for the same reason.
      - name: Measure the image's setuid and setgid files
        run: |
          set -euo pipefail
          measure() {
            docker run --rm --user 0 --entrypoint sh ${{ matrix.tag }} -c "$1"
          }
          probe='find / -xdev -type f \( -perm -2000 -o -perm -4000 \)'

          echo "$probe -exec ls -l {} +"
          measure "$probe -exec ls -l {} +"
          measured=$(measure "$probe" | LC_ALL=C sort)

          case "${{ matrix.variant }}" in
            # Each runtime stage takes off every setuid and setgid bit its own OS
            # closure brings in -- one file on Alpine, ten on Amazon Linux 2023 --
            # and neither stage's base carries another, so nothing is left for
            # this to find on either. Both images declare USER node, so a bit
            # left in place would be a boundary rather than a formality; the
            # instructions that take them off are held by
            # dockerfile-freeze.test.mjs, and this measures the outcome, which is
            # the half that also sees the base image's own files.
            default | fips) recorded="" ;;
            *)
              echo "no setuid/setgid inventory is recorded for the ${{ matrix.variant }} image" >&2
              exit 1
              ;;
          esac

          # How an image added to the matrix bootstraps its own row: set its arm
          # to the sentinel and the first run of this step fails that leg and
          # prints the block to paste back, so the surface is enforced from the
          # start rather than left unmeasured until someone writes a list by hand.
          #
          # The block it prints is a heredoc arm, which is what an image carrying
          # bits it does not strip needs. An image that strips its whole closure,
          # as both shipped ones do, takes the empty arm above instead and pastes
          # the measured paths into its Dockerfile's own `chmod u-s,g-s` rather
          # than here. The printed lines carry the run block's own ten-space
          # indentation baked in -- column 0 once YAML has stripped it, the
          # indentation that terminates the heredoc rather than the run block's
          # literal scalar -- so a paste at the arm's nesting needs no manual
          # reindenting.
          if [ "$recorded" = "@unrecorded" ]; then
            echo "the ${{ matrix.variant }} image's setuid/setgid inventory is unrecorded; this run measures it as:" >&2
            {
              echo "recorded=\$(cat <<'INVENTORY'"
              printf '%s\n' "$measured" | sed 's/^/          /'
              echo "          INVENTORY"
              echo "            )"
            } >&2
            exit 1
          fi

          if [ "$measured" != "$recorded" ]; then
            echo "the ${{ matrix.variant }} image carries setuid/setgid files the recorded inventory does not name, or is missing one it does" >&2
            diff <(printf '%s\n' "$recorded") <(printf '%s\n' "$measured") >&2 || true
            exit 1
          fi
          echo "the ${{ matrix.variant }} image's setuid/setgid files are the recorded inventory"

      # The OS package layer, which nothing else covers: Dependabot, the
      # dependency review gate and the release `npm audit` all stop at the npm
      # tree, so a vulnerability in the base image or one of its system packages
      # would otherwise reach an operator unflagged. The base is pinned by
      # digest, which is why the weekly schedule above exists -- a vulnerability
      # published against a pin nothing has touched has no other trigger.
      #
      # The scope and the threshold, set here rather than left to a default:
      #   - `vuln-type: os` keeps this to the layer the npm-side gates do not
      #     reach; a second gate over the npm tree would answer to a different
      #     threshold from the first and disagree with it.
      #   - `scanners: vuln` keeps a secret or misconfiguration finding from
      #     failing a step whose threshold is written for vulnerabilities.
      #   - `severity` and `ignore-unfixed` are the threshold: HIGH and above,
      #     fixable only. A gate that fires on a vulnerability no bump can
      #     resolve is unactionable and gets switched off, so an unfixable
      #     finding is deliberately invisible here.
      #   - accepted exceptions are in .github/trivyignore.yaml, each id
      #     carrying the reason it was accepted and an expiry date. Trivy
      #     stops applying an entry on that date and the finding returns
      #     here, which is the only thing that surfaces a stale
      #     acceptance: an entry in force keeps this gate green whether
      #     or not the condition it was written for still holds.
      #
      # A finding is a prompt to bump the pinned base -- the digest in the
      # Dockerfile, and on the variant the Amazon Linux release snapshot its dnf
      # transactions resolve against as well: the pins are deliberate, so nothing
      # on the npm side resolves them. For the default image the docker ecosystem
      # in .github/dependabot.yml opens that bump on its own weekly schedule
      # rather than in answer to this. The variant's base is ignored by that
      # block and moves as a coordinated human-reviewed change instead, so on
      # that leg a finding here is one of the signals the move answers to; the
      # procedure and the rest of them are in "Bumping the FIPS base image" in
      # docs/spec/DEPENDENCY_PINS.md.
      #
      # Temporarily scoped to the default leg. Both images are published and
      # the release workflow gates each one's push on this same scanner at this
      # same threshold, so the both-leg PR scan is the cheap half of that --
      # but the variant's pinned base rootfs currently carries fixable HIGH
      # findings no pin movement can reach (the amazonlinux:2023 tag has not
      # been rebuilt onto a snapshot carrying the fixes), and a check that is
      # red on every product PR for weeks teaches reviewers to ignore it.
      # Nothing unscanned can publish while this is narrowed: release.yaml
      # still gates BOTH images ahead of its registry login. Re-widen to both
      # legs in the same diff as the base digest + AL2023_RELEASEVER bump that
      # clears the findings.
      - name: Scan the image for OS-layer vulnerabilities
        id: vulnerability_scan
        if: ${{ matrix.fips == 'false' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.tag }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore.yaml
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          # Holds the SARIF to the same severities the gate answers to, so the
          # Security tab does not collect alerts for findings no run here fails
          # on.
          limit-severities-for-sarif: true

      # Puts the findings in the Security tab beside the CodeQL alerts rather
      # than only in this job's log. It runs whether the scan passed or failed --
      # a failing gate is exactly the run whose findings someone needs to read --
      # and is skipped when the scan step itself did not run.
      #
      # A pull request from a fork carries a read-only token, so there this would
      # fail on the permission rather than on anything it found. The gate above
      # still runs on such a pull request, and the step below is what its
      # findings reach.
      - name: Upload the image scan to code scanning
        id: image_scan_upload
        if: >-
          ${{ !cancelled()
          && steps.vulnerability_scan.outcome != 'skipped'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: container-image-${{ matrix.variant }}

      # The scan writes its report to a file rather than to stdout, so a run
      # whose upload did not succeed would fail the gate while showing nothing
      # it found. This puts the report where such a run can still be read.
      # Conditioned on the upload's outcome rather than on the fork predicate
      # above, so any other reason the alerts do not land is covered too.
      - name: Report the scan findings in the job log
        if: >-
          ${{ !cancelled()
          && steps.vulnerability_scan.outcome != 'skipped'
          && steps.image_scan_upload.outcome != 'success' }}
        run: cat trivy-image.sarif

  # docs/DEPLOYMENT.md hands the operator a restricted-egress recipe for the
  # containerized roles -- a dedicated network with a subnet they pin, an
  # allowlist written into the DOCKER-USER chain, and a `probe-host-key`
  # verification procedure. This job is where that recipe is executed: the
  # documented rules are applied against the image this repository builds and
  # every row of the doc's own verification table is asserted, so a recipe that
  # has stopped working -- a rule recorded at a position where it is never
  # reached, a Docker release that reorders the forward chain around
  # DOCKER-USER -- fails here instead of in a deployment.
  #
  # Its own job on its own runner, so the firewall rules it writes cannot reach
  # the smoke job's containers. Within the job every rule is scoped to the
  # subnet created here, and the teardown deletes them whatever the probes did.
  #
  # The endpoints sit off every Docker network, on a subnet reached through the
  # host, because that is where an operator's SFTP server and resolver sit: the
  # traffic is routed, which is the path the DOCKER-USER chain is consulted on.
  # Endpoints on a Docker network of their own would answer a different question
  # -- one about Docker's inter-network isolation -- and endpoints on the
  # restricted network itself a third, since traffic switched within one bridge
  # reaches the filter table only where br_netfilter is loaded, which a Docker
  # host does not require and the GitHub runner does not have.
  restricted_egress:
    name: Drive the documented restricted-egress recipe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PSILINK_IMAGE: psi-link:egress-smoke
      ENDPOINT_IMAGE: psi-link:egress-endpoint
      # The network name and subnet docs/DEPLOYMENT.md names, used literally.
      EGRESS_NET: psilink-egress
      EGRESS_SUBNET: 172.31.240.0/29
      # The endpoints' own addresses, from RFC 5737's documentation range so
      # nothing here can collide with a route the runner really has. One
      # network namespace carries all three: what the allowlist matches on is
      # the destination address, and the control run reaches every one of them,
      # so a refusal below is the rule rather than a dead endpoint.
      ENDPOINT_NETNS: psilink-endpoints
      ENDPOINT_PREFIX: "24"
      ENDPOINT_GATEWAY: 203.0.113.1
      ALLOWED_ADDR: 203.0.113.24
      DENIED_ADDR: 203.0.113.99
      RESOLVER_ADDR: 203.0.113.53
      # The doc's own example names, resolved by the permitted resolver rather
      # than by Docker's embedded container-name DNS: a name the allowlist can
      # actually drop is what makes probing by name a check of the resolver
      # rules and not decoration.
      ALLOWED_HOST: sftp.partner.example
      DENIED_HOST: some.other.host
      ALLOWED_PORT: "22"
      DENIED_PORT: "2222"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The subject is the image an operator runs, so it is built here rather
      # than approximated by the CLI on the runner. Reads the smoke job's cache
      # scope and writes none of its own: the two jobs run concurrently, and a
      # second writer on one scope would have them evicting each other.
      - name: Build image (amd64, load into local Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.PSILINK_IMAGE }}
          cache-from: type=gha,scope=default

      # The SSH server whose host key the probe reads. It listens on the
      # permitted port AND on a second one, so the denied-port row below
      # measures the firewall rather than a closed socket -- the control run
      # reaches that same port and is what establishes the difference.
      - name: Build the endpoint fixture
        run: |
          set -euo pipefail
          # Taken from the base this repository already pins by digest, so
          # driving the recipe introduces no second, floating image.
          base=$(sed -n 's/^FROM \(node:[^ ]*@sha256:[0-9a-f]*\).*/\1/p' Dockerfile | head -n 1)
          if [ -z "$base" ]; then
            echo "could not read a digest-pinned base image out of Dockerfile" >&2
            exit 1
          fi
          echo "endpoint fixture base: $base"
          cat >"$RUNNER_TEMP/endpoint.Dockerfile" <<DOCKERFILE
          FROM $base
          RUN apk add --no-cache openssh-server
          RUN ssh-keygen -A
          RUN printf 'Port $ALLOWED_PORT\nPort $DENIED_PORT\n' >> /etc/ssh/sshd_config
          ENTRYPOINT []
          DOCKERFILE
          docker buildx build --load --tag "$ENDPOINT_IMAGE" \
            --file "$RUNNER_TEMP/endpoint.Dockerfile" "$RUNNER_TEMP"

      # Step 1 of the recipe, performed literally: a network of this deployment's
      # own with a subnet chosen rather than drawn from Docker's pool, since the
      # rules name it.
      #
      # The endpoints go in a namespace of their own with no Docker network at
      # all, joined to the host by one veth pair and routed through it. The
      # resolver shares that namespace, so the whole fixture is one link, one
      # route, and the three addresses the rules name.
      #
      # The resolver is written here rather than taken off the shelf because
      # every answer it gives has to be authoritative. musl -- the resolver in
      # each container the job runs -- asks the A and the AAAA question together
      # and reads a REFUSED or SERVFAIL on either as a failure of the whole
      # lookup, so a server that punts on the AAAA half throws away the A record
      # it answered; dnsmasq configured with addresses and no upstream punts
      # exactly that way, measured on this runner. Each reply below is NOERROR
      # with an answer, NOERROR with none, or NXDOMAIN, and its log line is the
      # record of which names were resolved through the permitted address.
      - name: Start the endpoints and the restricted network
        run: |
          set -euo pipefail
          docker network create --subnet "$EGRESS_SUBNET" "$EGRESS_NET"

          cat >"$RUNNER_TEMP/resolver.mjs" <<'RESOLVER'
          import { createSocket } from "node:dgram";
          const RECORDS = new Map(
            process.env.RESOLVER_RECORDS.split(",").map((e) => e.split("=")),
          );
          const socket = createSocket("udp4");
          socket.on("message", (query, from) => {
            const labels = [];
            let at = 12;
            while (at < query.length && query[at] > 0 && (query[at] & 0xc0) === 0) {
              labels.push(query.toString("ascii", at + 1, at + 1 + query[at]));
              at += 1 + query[at];
            }
            if (query[at] !== 0 || at + 5 > query.length) return;
            const name = labels.join(".").toLowerCase();
            const type = query.readUInt16BE(at + 1);
            const address = RECORDS.get(name);
            const answering = address !== undefined && type === 1;
            console.log(
              `query[type ${type}] ${name} from ${from.address}: ` +
                (answering
                  ? `is ${address}`
                  : address !== undefined
                    ? "no record of that type"
                    : "no such name"),
            );
            const header = Buffer.alloc(12);
            header.writeUInt16BE(query.readUInt16BE(0), 0);
            const rcode = address === undefined ? 3 : 0;
            header.writeUInt16BE(0x8480 | (query.readUInt16BE(2) & 0x0100) | rcode, 2);
            header.writeUInt16BE(1, 4);
            header.writeUInt16BE(answering ? 1 : 0, 6);
            const record = answering
              ? Buffer.from([
                  0xc0, 0x0c, 0, 1, 0, 1, 0, 0, 0, 30, 0, 4,
                  ...address.split(".").map(Number),
                ])
              : Buffer.alloc(0);
            socket.send(
              Buffer.concat([header, query.subarray(12, at + 5), record]),
              from.port,
              from.address,
            );
          });
          socket.on("listening", () => {
            const bound = socket.address();
            console.log(`resolver bound to ${bound.address}:${bound.port}`);
          });
          // Bound to the resolver's own address rather than to every address in
          // the namespace, so a reply leaves from the address the query was
          // sent to. A wildcard bind picks its source by route, which here is
          // the interface's first address -- the SSH endpoint's -- and a reply
          // from an address the client never asked is one it discards.
          socket.bind(53, process.env.RESOLVER_ADDRESS);
          RESOLVER

          docker run -d --name psilink-endpoints --network none \
            "$ENDPOINT_IMAGE" /usr/sbin/sshd -D -e

          pid=$(docker inspect -f '{{.State.Pid}}' psilink-endpoints)
          sudo mkdir -p /var/run/netns
          sudo ln -sf "/proc/$pid/ns/net" "/var/run/netns/$ENDPOINT_NETNS"
          sudo ip link add psi-egress-h type veth peer name psi-egress-p
          sudo ip link set psi-egress-p netns "$ENDPOINT_NETNS"
          sudo ip addr add "$ENDPOINT_GATEWAY/$ENDPOINT_PREFIX" dev psi-egress-h
          sudo ip link set psi-egress-h up
          for address in "$ALLOWED_ADDR" "$DENIED_ADDR" "$RESOLVER_ADDR"
          do
            sudo ip -n "$ENDPOINT_NETNS" addr add \
              "$address/$ENDPOINT_PREFIX" dev psi-egress-p
          done
          sudo ip -n "$ENDPOINT_NETNS" link set lo up
          sudo ip -n "$ENDPOINT_NETNS" link set psi-egress-p up
          sudo ip -n "$ENDPOINT_NETNS" route add default via "$ENDPOINT_GATEWAY"
          sudo ip -n "$ENDPOINT_NETNS" addr show psi-egress-p

          # After the addresses exist, since it binds one of them by name.
          docker run -d --name psilink-resolver \
            --network "container:psilink-endpoints" \
            -v "$RUNNER_TEMP/resolver.mjs:/resolver.mjs:ro" \
            -e "RESOLVER_ADDRESS=$RESOLVER_ADDR" \
            -e "RESOLVER_RECORDS=$ALLOWED_HOST=$ALLOWED_ADDR,$DENIED_HOST=$DENIED_ADDR" \
            "$ENDPOINT_IMAGE" node /resolver.mjs

      # Before any rule exists, so a fixture that never came up is diagnosed as
      # that rather than read later as a refusal. Off the restricted network,
      # and every row the probes below use: the three addresses answering, and
      # the two names resolving through the resolver.
      - name: Wait for the endpoints to answer
        run: |
          set -uo pipefail
          for target in "sftp://$ALLOWED_ADDR" "sftp://$ALLOWED_ADDR:$DENIED_PORT" \
            "sftp://$DENIED_ADDR" "sftp://$ALLOWED_HOST" "sftp://$DENIED_HOST"
          do
            ready=false
            for attempt in $(seq 1 20)
            do
              if timeout 60 docker run --rm --dns "$RESOLVER_ADDR" \
                "$PSILINK_IMAGE" probe-host-key "$target" \
                --connect-timeout 5s >/dev/null 2>&1
              then
                echo "$target answered on attempt $attempt"
                ready=true
                break
              fi
              sleep 3
            done
            if [ "$ready" != true ]; then
              echo "$target never answered; the endpoint fixture did not start" >&2
              docker logs psilink-endpoints || true
              docker logs psilink-resolver || true
              exit 1
            fi
          done

      # Step 2 of the recipe, in the doc's own order and at the doc's own rule
      # numbers: -I inserts at the position given, so the numbering is what
      # keeps the DROP last rather than first. The rule lines are held identical
      # to the doc's by scripts/egress-recipe-parity.test.mjs, which the scripts
      # suite runs on every pull request, this workflow's paths trigger or not.
      - name: Apply the documented DOCKER-USER allowlist
        run: |
          set -euo pipefail
          docker version --format 'Docker Engine {{.Server.Version}}'
          # What Docker itself left in the chain, read back before anything is
          # inserted so an odd run can be read against the chain it started from.
          sudo iptables -L DOCKER-USER -n --line-numbers

          SUBNET="$EGRESS_SUBNET"
          SFTP_ADDR="$ALLOWED_ADDR"
          SFTP_PORT="$ALLOWED_PORT"
          RESOLVER="$RESOLVER_ADDR"

          sudo iptables -I DOCKER-USER 1 -s "$SUBNET" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -I DOCKER-USER 2 -s "$SUBNET" -p tcp -d "$SFTP_ADDR" --dport "$SFTP_PORT" -j ACCEPT
          sudo iptables -I DOCKER-USER 3 -s "$SUBNET" -p udp -d "$RESOLVER" --dport 53 -j ACCEPT
          sudo iptables -I DOCKER-USER 4 -s "$SUBNET" -p tcp -d "$RESOLVER" --dport 53 -j ACCEPT
          sudo iptables -I DOCKER-USER 5 -s "$SUBNET" -j DROP

          sudo iptables -L DOCKER-USER -n --line-numbers

      # The doc's verification section, run. Every row is measured before the
      # step decides, so one wrong answer does not hide the rest.
      #
      # The last pair is the doc's resolution diagnostic, and it is what makes
      # the by-name rows above mean something: with the two resolver rules
      # deleted, the permitted endpoint must stop being reachable BY NAME while
      # staying reachable BY ADDRESS. A run where name resolution took some path
      # the allowlist does not govern would pass the by-name row here, and this
      # pair is what refuses to let that read as a working allowlist.
      - name: Drive the documented probe against the allowlist
        run: |
          set -uo pipefail
          failures=0
          probe() {
            local label="$1" network="$2" target="$3" expected="$4"
            local status=0
            local -a attach=()
            # The control rows pass no --network at all, which is the doc's own
            # "run it a second time without --network psilink-egress".
            if [ -n "$network" ]; then attach=(--network "$network"); fi
            echo "--- $label: $target"
            timeout 120 docker run --rm "${attach[@]}" --dns "$RESOLVER_ADDR" \
              "$PSILINK_IMAGE" probe-host-key "$target" --connect-timeout 10s \
              || status=$?
            if [ "$status" = "$expected" ]; then
              echo "$label: exited $status, as the recipe says it must"
            else
              echo "::error::$label: $target exited $status, expected $expected"
              failures=$((failures + 1))
            fi
          }

          echo "== on the restricted network"
          probe "permitted endpoint" "$EGRESS_NET" "sftp://$ALLOWED_HOST" 0
          probe "denied port" "$EGRESS_NET" \
            "sftp://$ALLOWED_HOST:$DENIED_PORT" 69
          probe "denied host" "$EGRESS_NET" "sftp://$DENIED_HOST" 69

          echo "== off the restricted network"
          probe "control, permitted endpoint" "" "sftp://$ALLOWED_HOST" 0
          probe "control, denied port" "" \
            "sftp://$ALLOWED_HOST:$DENIED_PORT" 0
          probe "control, denied host" "" "sftp://$DENIED_HOST" 0

          echo "== with the two resolver rules deleted"
          sudo iptables -D DOCKER-USER -s "$EGRESS_SUBNET" -p udp -d "$RESOLVER_ADDR" --dport 53 -j ACCEPT
          sudo iptables -D DOCKER-USER -s "$EGRESS_SUBNET" -p tcp -d "$RESOLVER_ADDR" --dport 53 -j ACCEPT
          sudo iptables -L DOCKER-USER -n --line-numbers
          probe "resolver dropped, by name" "$EGRESS_NET" \
            "sftp://$ALLOWED_HOST" 69
          probe "resolver dropped, by address" "$EGRESS_NET" \
            "sftp://$ALLOWED_ADDR" 0

          if [ "$failures" != 0 ]; then
            echo "$failures probe(s) did not answer as the documented recipe says they must" >&2
            exit 1
          fi
          echo "every row of the documented verification answered as written"

      # Runs whatever the probes did. The runner is ephemeral, so this is
      # hygiene rather than a requirement -- but a rule left in DOCKER-USER
      # would silently govern anything else scheduled onto this machine, and
      # the resolver's query log is the record of which names were resolved
      # through the permitted resolver rather than some other way.
      - name: Tear the rules and the endpoints down
        if: always()
        run: |
          set +e
          for container in psilink-endpoints psilink-resolver
          do
            echo "--- $container"
            docker logs "$container" 2>&1 | tail -n 40
          done

          sudo iptables -D DOCKER-USER -s "$EGRESS_SUBNET" -j DROP
          sudo iptables -D DOCKER-USER -s "$EGRESS_SUBNET" -p tcp -d "$RESOLVER_ADDR" --dport 53 -j ACCEPT 2>/dev/null
          sudo iptables -D DOCKER-USER -s "$EGRESS_SUBNET" -p udp -d "$RESOLVER_ADDR" --dport 53 -j ACCEPT 2>/dev/null
          sudo iptables -D DOCKER-USER -s "$EGRESS_SUBNET" -p tcp -d "$ALLOWED_ADDR" --dport "$ALLOWED_PORT" -j ACCEPT
          sudo iptables -D DOCKER-USER -s "$EGRESS_SUBNET" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -L DOCKER-USER -n --line-numbers

          docker rm -f psilink-resolver psilink-endpoints
          docker network rm "$EGRESS_NET"
          sudo ip link del psi-egress-h
          sudo rm -f "/var/run/netns/$ENDPOINT_NETNS"
          exit 0

  # The other half of the capability gate, and the only one that observes what an
  # operator's setup run really reaches. Setup-PsilinkFileDrop.ps1 is fetched off
  # the default branch on its own and runs the floating `vdorie/psi-link:latest`,
  # which is published only from a version tag: nothing locks the script to any
  # image, so a capability can be on the default branch and absent from the tag
  # the script pulls for as long as no release has been cut.
  #
  # Deliberately off the pull-request trigger, and therefore never a merge gate:
  # the remedy for the commonest red here is a release, which is the maintainer's
  # to cut and no reason to hold a merge. It shares the weekly schedule with the
  # vulnerability scan above, which re-runs against a moving world for the same
  # reason -- the subject changes with nothing in this repository changing.
  published_image:
    name: Assert the published image answers what the setup scripts invoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Pinned for the same reason as the smoke job above: the assertion runs on
      # the runner's Node, and the script it runs is dependency-free.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      # The pull is separate from the assertion so a registry that could not be
      # reached is not read as a capability the image does not carry. The step
      # after it prints the digest the tag resolved to, which is the only thing a
      # green run here may be read as a claim about: the tag moves.
      - name: Pull the published image
        run: docker pull vdorie/psi-link:latest

      - name: Assert the published image answers what the setup scripts invoke
        id: published_capabilities
        run: node scripts/assert-image-capabilities.mjs vdorie/psi-link:latest

      - name: Say what an unanswered dependency here means
        if: failure() && steps.published_capabilities.outcome == 'failure'
        run: |
          {
            echo "## The published image did not answer every dependency"
            echo
            echo "The step above ran against \`vdorie/psi-link:latest\`, which is"
            echo "published only from a version tag. A gap has two readings and the"
            echo "log does not distinguish them:"
            echo
            echo "- a support script asks the image for something no build of it"
            echo "  provides, which is a defect in the script or in the image; or"
            echo "- the capability is on the default branch and no release has been"
            echo "  cut since, so the published tag has not caught up yet."
            echo
            echo "The second is the reading to check first, and cutting a release is"
            echo "its remedy (docs/RELEASES.md). This leg runs on the schedule and on"
            echo "demand only, never on a pull request, so it gates no merge either way."
          } >> "$GITHUB_STEP_SUMMARY"
