name: Image Smoke

# Pull-request smoke test for the combined CLI + web-console appliance image
# (the same Dockerfile release.yaml ships). Release builds the image only at a
# version tag, so this is the sole pre-merge check that the image actually builds
# and that both of its roles run: the headless CLI and the `serve` web console.
#
# It builds single-arch (native amd64, no QEMU) and loads the image into the
# runner's Docker so it can run it -- deliberately faster and simpler than the
# release job's multi-arch build+push, since nothing is published here.
#
# Scoped by path to changes that can affect the image. If this is made a required
# status check, configure branch protection so a path-skipped run does not block
# an unrelated PR -- a skipped required check otherwise stays pending.
on:
  pull_request:
    branches: [main, staging]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "apps/**"
      - "packages/**"
      - "lib/**"
      - "package-lock.json"
      # The builder copies the root .npmrc and package.json in beside the
      # lockfile, so the install policy the one states and the allowScripts map
      # the other carries are image build inputs on the same footing: a flag
      # interaction, an added registry, or a verdict change that only breaks the
      # containerised install would otherwise surface first at a release tag.
      - ".npmrc"
      - "package.json"
      # The CLI smoke below runs a real exchange over these two synthetic
      # inputs, so a change to their schema breaks it here rather than in a
      # release build.
      - "test_data/**"
      - ".github/workflows/image_smoke.yaml"

# Cancel a superseded run when a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege: this gate only needs to read the repo and build locally.
permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image COPYs the vendored @openmined/psi.js tarball (a file:
      # dependency with no npm integrity hash) and installs it; verify its
      # committed sha256 before the build, mirroring the release job.
      - name: Verify vendored native tarball integrity
        run: sha256sum -c lib/openmined-psi.js-*.tgz.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single-arch, load into the runner's Docker so the smoke steps can run it.
      # No push, no QEMU, no multi-arch -- that is the release job's concern.
      - name: Build image (amd64, load into local Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: psi-link:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image runs unprivileged, and every other step here would pass just as
      # happily as uid 0 -- so a dropped or widened USER line is invisible to all
      # of them and needs its own assertion. The uid is not merely non-zero but
      # the exact one docs/DEPLOYMENT.md tells operators to chown a bind mount to.
      - name: Smoke the container's identity
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id psi-link:smoke -u)
          gid=$(docker run --rm --entrypoint id psi-link:smoke -g)
          echo "the image runs as uid $uid, gid $gid"
          if [ "$uid" != 1000 ] || [ "$gid" != 1000 ]; then
            echo "expected uid 1000 and gid 1000, the pair docs/DEPLOYMENT.md documents" >&2
            exit 1
          fi

      # Role 1: the headless CLI still runs. `--help` is a read-only invocation
      # that exits 0 (no exchange, no key material, no network).
      - name: Smoke the CLI role
        run: docker run --rm psi-link:smoke --help

      # Role 1, for real: an invitation, an acceptance, and both halves of an
      # exchange over a shared folder, every command in a container running as
      # the unprivileged user. `--help` proves nothing about the change this
      # guards -- writing does. /work is an operator-supplied bind mount that
      # carries its HOST ownership into the container, so the result CSV and the
      # rotated key file land only if the ownership docs/DEPLOYMENT.md asks a
      # Linux operator for is the ownership the image actually needs; the chown
      # below is that documented step, performed literally.
      #
      # single-pass keeps the round-trip count constant instead of one round per
      # linkage key, which is what keeps this to seconds; the strategy is a
      # consented disclosure tradeoff, and these are synthetic inputs.
      - name: Smoke the CLI role over a writable bind mount
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cli-smoke"
          mkdir -p "$work/inviter" "$work/acceptor" "$work/drop"
          cp test_data/fake_data_1.csv "$work/inviter/input.csv"
          cp test_data/fake_data_2.csv "$work/acceptor/input.csv"
          # The parent stays the runner's, so the steps below can still stat what
          # the container writes; the mounts themselves go to the image's uid.
          sudo chown -R 1000:1000 "$work/inviter" "$work/acceptor" "$work/drop"

          # Both parties' configuration is written with an SFTP placeholder
          # connection block. This replaces that block with the shared folder,
          # and runs in the image because the file it edits belongs to the
          # container's user rather than to this runner.
          printf '%s\n' \
            '/^connection:/ { print "connection:"; print "  channel: filedrop"; print "  path: /drop"; skip = 1; next }' \
            'skip && /^[ \t]/ { next }' \
            '{ skip = 0; print }' \
            > "$work/repoint.awk"
          repoint() {
            docker run --rm \
              -v "$work/$1":/work -v "$work/repoint.awk":/repoint.awk:ro \
              --entrypoint sh psi-link:smoke -c '
                set -e
                awk -f /repoint.awk /work/psilink.yaml > /work/psilink.yaml.repointed
                mv /work/psilink.yaml.repointed /work/psilink.yaml
                chmod 600 /work/psilink.yaml
              '
          }
          cli() {
            local party="$1"
            shift
            docker run --rm \
              -v "$work/$party":/work -v "$work/drop":/drop \
              psi-link:smoke "$@"
          }

          # The invitation is the command's stdout. Its stderr log repeats the
          # whole invitation -- the shared secret with it -- in the "your partner
          # accepts with" line, and this job's log is public, so that stream goes
          # to a file beside the mounts instead of into the log. On a failure the
          # step reports the exit status and the size of what it held back:
          # printing the file would put the invitation in the public log exactly
          # as capturing the stream would have, so a failing invite is diagnosed
          # from the status and the shape of its output, and reproduced locally.
          invite_stderr="$work/invite.stderr"
          invite_status=0
          invitation=$(cli inviter invite input.csv --linkage-strategy single-pass \
            2>"$invite_stderr") || invite_status=$?
          if [ "$invite_status" != 0 ]; then
            echo "invite exited $invite_status" >&2
            echo "it wrote ${#invitation} bytes to stdout, and $(wc -c <"$invite_stderr") bytes over $(wc -l <"$invite_stderr") lines to stderr, withheld here because that stream repeats the invitation" >&2
            exit 1
          fi
          repoint inviter
          key_before=$(sudo sha256sum "$work/inviter/.psilink.key" | cut -d " " -f 1)

          cli acceptor accept "$invitation" input.csv --consent-to-terms
          repoint acceptor

          inviter_cid=$(docker run -d \
            -v "$work/inviter":/work -v "$work/drop":/drop \
            psi-link:smoke exchange input.csv output.csv --polling-frequency 1s)
          acceptor_cid=$(docker run -d \
            -v "$work/acceptor":/work -v "$work/drop":/drop \
            psi-link:smoke exchange input.csv output.csv --polling-frequency 1s)
          echo "started exchange halves $inviter_cid and $acceptor_cid"

          # Each half waits for the other, so both must be running before either
          # can finish; the timeout keeps a stalled rendezvous from hanging the job.
          inviter_rc=$(timeout 300 docker wait "$inviter_cid" || echo timed-out)
          acceptor_rc=$(timeout 300 docker wait "$acceptor_cid" || echo timed-out)
          docker logs "$inviter_cid" || true
          docker logs "$acceptor_cid" || true
          docker rm -f "$inviter_cid" "$acceptor_cid" >/dev/null 2>&1 || true
          if [ "$inviter_rc" != 0 ] || [ "$acceptor_rc" != 0 ]; then
            echo "an exchange half did not exit 0 (inviter=$inviter_rc, acceptor=$acceptor_rc)" >&2
            exit 1
          fi

          # The owner-only write path, under the non-root uid: every file the
          # exchange left in either party's own bind mount is mode 0600 and
          # belongs to that uid. Each mount is walked rather than a list of names
          # checked, so an artifact the CLI gains later -- a record, a key
          # sidecar -- is covered without editing this step, and each is required
          # to be non-empty on its own, so a run where only one half wrote
          # anything fails here rather than passing on the other's files.
          #
          # The third mount, the shared drop directory, is deliberately outside
          # the walk: it is the partner-visible transfer folder, and no
          # confidentiality claim rests on the modes of what lands there.
          #
          # Two names are skipped inside the two walked mounts. input.csv is the
          # file this step placed there itself. psilink.yaml is excluded because
          # its mode here would be this step's own doing rather than the image's:
          # the repoint above rewrites the file through a shell redirect, which
          # creates it at the container's umask, and then chmods the result to
          # 600 -- so the assertion would attest that chmod. The CLI writes the
          # config owner-only itself (writeFileOwnerOnly, apps/cli/src/config.ts).
          for party in inviter acceptor
          do
            artifacts=$(sudo find "$work/$party" -type f \
              ! -name input.csv ! -name psilink.yaml | sort)
            if [ -z "$artifacts" ]; then
              echo "the exchange left no files in the $party bind mount" >&2
              exit 1
            fi
            while IFS= read -r artifact
            do
              mode=$(sudo stat -c "%a" "$artifact")
              owner=$(sudo stat -c "%u" "$artifact")
              echo "${artifact#"$work"/}: mode $mode, owner uid $owner"
              if [ "$mode" != 600 ] || [ "$owner" != 1000 ]; then
                echo "${artifact#"$work"/} must be mode 600 owned by uid 1000" >&2
                exit 1
              fi
            done <<< "$artifacts"
          done

          # The rotated token is written back after a successful exchange, so a
          # mount the container user cannot write would fail here even though the
          # exchange itself had already succeeded.
          key_after=$(sudo sha256sum "$work/inviter/.psilink.key" | cut -d " " -f 1)
          if [ "$key_before" = "$key_after" ]; then
            echo "the rotated token was not written back to the bind mount" >&2
            exit 1
          fi

      # Role 2: the web console server comes up and serves. Start it detached in
      # `serve` mode, poll the root URL until it answers HTTP 200 within a bounded
      # timeout, then tear the container down. Both exits -- the timeout-failure
      # branch (after dumping logs) and the success fall-through -- remove the
      # container by hand; there is no separate teardown step to rely on.
      #
      # JOB_DATA_ROOT turns the job API on, which is what makes this a smoke of
      # the console appliance rather than of the web UI alone: enabling it puts
      # the fail-closed credential-scratch setup in the startup path, and that
      # setup writes under root-owned /run. An unprivileged server refuses to
      # boot there unless the image prepared the directory for it, so this step
      # would time out rather than answer.
      - name: Smoke the serve role
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/serve-smoke"
          mkdir -p "$data"
          sudo chown 1000:1000 "$data"
          # Published on the loopback interface alone: the probe below reaches it
          # at 127.0.0.1, so nothing needs the runner's other interfaces to carry
          # a console with the job API enabled.
          cid=$(docker run -d -p 127.0.0.1:3000:3000 \
            --env JOB_DATA_ROOT=/data -v "$data":/data \
            psi-link:smoke serve)
          echo "started server container $cid"

          ok=false
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "server answered HTTP 200 on attempt $attempt"
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "server did not answer HTTP 200 within the timeout" >&2
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f "$cid" >/dev/null 2>&1 || true

      # The Windows file-drop setup scripts run their SMB probe inside this
      # image, so the smbclient the runtime stage installs is load-bearing for
      # that setup path: the probe checks for it and stops before it reaches the
      # share when it is missing, so an image published without it strands that
      # setup entirely. `command -v` resolves it from PATH and needs no network
      # and no server. The entrypoint
      # is overridden because it dispatches its argv to the CLI, as the setup
      # scripts override it for the same reason.
      - name: Smoke the file-drop probe tooling
        run: docker run --rm --entrypoint sh psi-link:smoke -c 'command -v smbclient'
