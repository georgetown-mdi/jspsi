name: Image Smoke

# Smoke test for the container images this repository ships: the default CLI +
# web-console appliance image (the same Dockerfile release.yaml ships) and the
# FIPS variant (Dockerfile.fips, which is built and smoked here but published
# nowhere). Release builds the default image only at a version tag, so this is
# the sole pre-merge check that either image actually builds and that both of
# its roles run: the headless CLI and the `serve` web console.
#
# It builds single-arch (native amd64, no QEMU) and loads each image into the
# runner's Docker so it can run it -- deliberately faster and simpler than the
# release job's multi-arch build+push, since nothing is published here.
#
# The pull-request trigger is scoped by path to changes that can affect an
# image. If this is made a required status check, configure branch protection so
# a path-skipped run does not block an unrelated PR -- a skipped required check
# otherwise stays pending.
on:
  # An on-demand run: how a maintainer re-checks the images after bumping the
  # base digest, without waiting for the schedule or opening a pull request.
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
    paths:
      - "Dockerfile"
      - "Dockerfile.fips"
      - "openssl-fips-only.cnf"
      - "docker-entrypoint.sh"
      - "docker-entrypoint-fips.sh"
      - ".dockerignore"
      - "apps/**"
      - "packages/**"
      - "lib/**"
      - "package-lock.json"
      # The builder copies the root .npmrc and package.json in beside the
      # lockfile, so the install policy the one states and the allowScripts map
      # the other carries are image build inputs on the same footing: a flag
      # interaction, an added registry, or a verdict change that only breaks the
      # containerised install would otherwise surface first at a release tag.
      - ".npmrc"
      - "package.json"
      # The FIPS leg runs both harnesses out of this directory.
      - "support/fips-probe/**"
      # Both legs run a real exchange over these two synthetic inputs, so a
      # change to their schema breaks it here rather than in a release build.
      - "test_data/**"
      - ".github/workflows/image_smoke.yaml"
      # The exception list the vulnerability scan below reads.
      - ".github/trivyignore"
  # Weekly re-run against a refreshed vulnerability database. The base images
  # are pinned by digest, so a vulnerability published against one of them
  # reaches an operator with nothing in this repository changed -- no path above
  # matches, and no other trigger fires. Monday, matching the Dependabot cadence
  # in .github/dependabot.yml, as codeql.yaml does for the same reason.
  schedule:
    - cron: "45 5 * * 1"

# Cancel a superseded run when a newer commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege at the top level; the smoke job widens to what the scan's
# SARIF upload needs.
permissions:
  contents: read

jobs:
  smoke:
    name: Build and smoke the ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    permissions:
      # actions/checkout.
      contents: read
      # Upload the vulnerability scan's SARIF as code-scanning alerts.
      security-events: write
    # The FIPS leg's exchange step runs a real two-party exchange over a polled
    # file drop, so this bound is well above the default-image leg's needs.
    timeout-minutes: 60
    strategy:
      # One image failing to build says nothing about the other, and the FIPS
      # leg's findings are the more expensive to re-run.
      fail-fast: false
      matrix:
        include:
          - variant: default
            dockerfile: Dockerfile
            tag: psi-link:smoke
            fips: "false"
          - variant: fips
            dockerfile: Dockerfile.fips
            tag: psi-link:fips-smoke
            fips: "true"
    steps:
      - uses: actions/checkout@v7

      # The image COPYs the vendored @openmined/psi.js tarball (a file:
      # dependency with no npm integrity hash) and installs it; verify its
      # committed sha256 before the build, mirroring the release job.
      - name: Verify vendored native tarball integrity
        run: sha256sum -c lib/openmined-psi.js-*.tgz.sha256

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Single-arch, load into the runner's Docker so the smoke steps can run
      # it. No push, no QEMU, no multi-arch -- that is the release job's
      # concern. The cache is scoped per variant: the two images share no layer,
      # so one scope would have them evicting each other.
      - name: Build image (amd64, load into local Docker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      # The default image runs unprivileged, and every other step here would pass
      # just as happily as uid 0 -- so a dropped or widened USER line is invisible
      # to all of them and needs its own assertion. The uid is not merely non-zero
      # but the exact one docs/DEPLOYMENT.md tells operators to chown a bind mount
      # to. The variant carries no USER and makes no such claim, so this and the
      # bind-mount step below are the default leg's alone until it drops privilege
      # too; dockerfile-freeze.test.mjs scopes its ownership guard the same way.
      - name: Smoke the container's identity
        if: matrix.fips == 'false'
        run: |
          set -euo pipefail
          uid=$(docker run --rm --entrypoint id ${{ matrix.tag }} -u)
          gid=$(docker run --rm --entrypoint id ${{ matrix.tag }} -g)
          echo "the image runs as uid $uid, gid $gid"
          if [ "$uid" != 1000 ] || [ "$gid" != 1000 ]; then
            echo "expected uid 1000 and gid 1000, the pair docs/DEPLOYMENT.md documents" >&2
            exit 1
          fi

      # What the image hands the account it runs as, measured on the built image
      # rather than read off the instruction that declares it. The runtime stage
      # gives that account /work and the console's credential scratch directory
      # and withholds /app, so the process reads and executes its own code
      # without being able to rewrite it; dockerfile-freeze.test.mjs holds the
      # instruction, and only a run reaches what the instruction produced on top
      # of whatever the base image already did.
      #
      # Probed by writing rather than by `test -w`: a mode that reads as writable
      # over a layer or a mount that refuses the write is the case a stat cannot
      # tell apart. The /app walk is the other half -- a file the account owns,
      # or one any group it carries can write, is code it can rewrite in place
      # without /app itself ever being writable -- and it runs as uid 0 so no
      # directory mode can hide a path from it, ownership and mode being facts
      # about the image either way.
      #
      # The walk skips symlinks. Linux has no chmod for a symlink: its own mode
      # is 0777 and grants nothing, so `-perm`, which tests the lstat mode,
      # matches every link in the image while saying nothing about rewriting.
      # Re-pointing a link takes write permission on the directory holding it,
      # which the walk already reaches through that directory itself.
      #
      # Scoped to the default image, as the identity step above is: the variant
      # carries no USER and makes no unprivileged claim.
      - name: Measure the container's writable set
        if: matrix.fips == 'false'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh ${{ matrix.tag }} -c '
            set -eu
            for tree in /work /run/psilink/sftp-credentials
            do
              probe="$tree/.write-probe.$$"
              if ! touch "$probe"; then
                echo "$tree is not writable by the account the image runs as" >&2
                exit 1
              fi
              rm -f "$probe"
              echo "$tree: writable"
            done
            if touch "/app/.write-probe.$$" 2>/dev/null; then
              rm -f "/app/.write-probe.$$"
              echo "/app is writable by the account the image runs as" >&2
              exit 1
            fi
            echo "/app: not writable"
          '

          reachable=$(docker run --rm --user 0 --entrypoint sh ${{ matrix.tag }} -c '
            set -eu
            echo "the runtime account is uid $(id -u node), in groups $(id -Gn node)" >&2
            set -- -user "$(id -u node)" -o -perm -0002
            for gid in $(id -G node)
            do
              set -- "$@" -o -group "$gid"
            done
            find /app ! -type l \( "$@" \) -print
          ')
          if [ -n "$reachable" ]; then
            count=$(printf '%s\n' "$reachable" | wc -l)
            echo "$count paths under /app are owned by, or writable by, the account the image runs as; the first of them:" >&2
            printf '%s\n' "$reachable" | head -n 40 >&2
            exit 1
          fi
          echo "/app: no path owned by that account or by a group it carries, and none other-writable"

      # Role 1: the headless CLI still runs. `--help` is a read-only invocation
      # that exits 0 (no exchange, no key material, no network).
      - name: Smoke the CLI role
        run: docker run --rm ${{ matrix.tag }} --help

      # Role 1, for real: an invitation, an acceptance, and both halves of an
      # exchange over a shared folder, every command in a container running as
      # the unprivileged user. `--help` proves nothing about the change this
      # guards -- writing does. /work is an operator-supplied bind mount that
      # carries its HOST ownership into the container, so the result CSV and the
      # rotated key file land only if the ownership docs/DEPLOYMENT.md asks a
      # Linux operator for is the ownership the image actually needs; the chown
      # below is that documented step, performed literally.
      #
      # single-pass keeps the round-trip count constant instead of one round per
      # linkage key, which is what keeps this to seconds; the strategy is a
      # consented disclosure tradeoff, and these are synthetic inputs.
      - name: Smoke the CLI role over a writable bind mount
        if: matrix.fips == 'false'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cli-smoke"
          mkdir -p "$work/inviter" "$work/acceptor" "$work/drop"
          cp test_data/fake_data_1.csv "$work/inviter/input.csv"
          cp test_data/fake_data_2.csv "$work/acceptor/input.csv"
          # The parent stays the runner's, so the steps below can still stat what
          # the container writes; the mounts themselves go to the image's uid.
          sudo chown -R 1000:1000 "$work/inviter" "$work/acceptor" "$work/drop"

          # Both parties' configuration is written with an SFTP placeholder
          # connection block. This replaces that block with the shared folder,
          # and runs in the image because the file it edits belongs to the
          # container's user rather than to this runner.
          printf '%s\n' \
            '/^connection:/ { print "connection:"; print "  channel: filedrop"; print "  path: /drop"; skip = 1; next }' \
            'skip && /^[ \t]/ { next }' \
            '{ skip = 0; print }' \
            > "$work/repoint.awk"
          repoint() {
            docker run --rm \
              -v "$work/$1":/work -v "$work/repoint.awk":/repoint.awk:ro \
              --entrypoint sh ${{ matrix.tag }} -c '
                set -e
                awk -f /repoint.awk /work/psilink.yaml > /work/psilink.yaml.repointed
                mv /work/psilink.yaml.repointed /work/psilink.yaml
                chmod 600 /work/psilink.yaml
              '
          }
          cli() {
            local party="$1"
            shift
            docker run --rm \
              -v "$work/$party":/work -v "$work/drop":/drop \
              ${{ matrix.tag }} "$@"
          }

          # The invitation is the command's stdout. Its stderr log repeats the
          # whole invitation -- the shared secret with it -- in the "your partner
          # accepts with" line, and this job's log is public, so that stream goes
          # to a file beside the mounts instead of into the log. On a failure the
          # step reports the exit status and the size of what it held back:
          # printing the file would put the invitation in the public log exactly
          # as capturing the stream would have, so a failing invite is diagnosed
          # from the status and the shape of its output, and reproduced locally.
          invite_stderr="$work/invite.stderr"
          invite_status=0
          invitation=$(cli inviter invite input.csv --linkage-strategy single-pass \
            2>"$invite_stderr") || invite_status=$?
          if [ "$invite_status" != 0 ]; then
            echo "invite exited $invite_status" >&2
            echo "it wrote ${#invitation} bytes to stdout, and $(wc -c <"$invite_stderr") bytes over $(wc -l <"$invite_stderr") lines to stderr, withheld here because that stream repeats the invitation" >&2
            exit 1
          fi
          repoint inviter
          key_before=$(sudo sha256sum "$work/inviter/.psilink.key" | cut -d " " -f 1)

          cli acceptor accept "$invitation" input.csv --consent-to-terms
          repoint acceptor

          inviter_cid=$(docker run -d \
            -v "$work/inviter":/work -v "$work/drop":/drop \
            ${{ matrix.tag }} exchange input.csv output.csv --polling-frequency 1s)
          acceptor_cid=$(docker run -d \
            -v "$work/acceptor":/work -v "$work/drop":/drop \
            ${{ matrix.tag }} exchange input.csv output.csv --polling-frequency 1s)
          echo "started exchange halves $inviter_cid and $acceptor_cid"

          # Each half waits for the other, so both must be running before either
          # can finish; the timeout keeps a stalled rendezvous from hanging the job.
          inviter_rc=$(timeout 300 docker wait "$inviter_cid" || echo timed-out)
          acceptor_rc=$(timeout 300 docker wait "$acceptor_cid" || echo timed-out)
          docker logs "$inviter_cid" || true
          docker logs "$acceptor_cid" || true
          docker rm -f "$inviter_cid" "$acceptor_cid" >/dev/null 2>&1 || true
          if [ "$inviter_rc" != 0 ] || [ "$acceptor_rc" != 0 ]; then
            echo "an exchange half did not exit 0 (inviter=$inviter_rc, acceptor=$acceptor_rc)" >&2
            exit 1
          fi

          # The owner-only write path, under the non-root uid: every file the
          # exchange left in either party's own bind mount is mode 0600 and
          # belongs to that uid. Each mount is walked rather than a list of names
          # checked, so an artifact the CLI gains later -- a record, a key
          # sidecar -- is covered without editing this step, and each is required
          # to be non-empty on its own, so a run where only one half wrote
          # anything fails here rather than passing on the other's files.
          #
          # The third mount, the shared drop directory, is deliberately outside
          # the walk: it is the partner-visible transfer folder, and no
          # confidentiality claim rests on the modes of what lands there.
          #
          # Two names are skipped inside the two walked mounts. input.csv is the
          # file this step placed there itself. psilink.yaml is excluded because
          # its mode here would be this step's own doing rather than the image's:
          # the repoint above rewrites the file through a shell redirect, which
          # creates it at the container's umask, and then chmods the result to
          # 600 -- so the assertion would attest that chmod. The CLI writes the
          # config owner-only itself (writeFileOwnerOnly, apps/cli/src/config.ts).
          for party in inviter acceptor
          do
            artifacts=$(sudo find "$work/$party" -type f \
              ! -name input.csv ! -name psilink.yaml | sort)
            if [ -z "$artifacts" ]; then
              echo "the exchange left no files in the $party bind mount" >&2
              exit 1
            fi
            while IFS= read -r artifact
            do
              mode=$(sudo stat -c "%a" "$artifact")
              owner=$(sudo stat -c "%u" "$artifact")
              echo "${artifact#"$work"/}: mode $mode, owner uid $owner"
              if [ "$mode" != 600 ] || [ "$owner" != 1000 ]; then
                echo "${artifact#"$work"/} must be mode 600 owned by uid 1000" >&2
                exit 1
              fi
            done <<< "$artifacts"
          done

          # The rotated token is written back after a successful exchange, so a
          # mount the container user cannot write would fail here even though the
          # exchange itself had already succeeded.
          key_after=$(sudo sha256sum "$work/inviter/.psilink.key" | cut -d " " -f 1)
          if [ "$key_before" = "$key_after" ]; then
            echo "the rotated token was not written back to the bind mount" >&2
            exit 1
          fi

      # Role 2: the web console server comes up and serves. Start it detached in
      # `serve` mode, poll the root URL until it answers HTTP 200 within a bounded
      # timeout, then tear the container down. Both exits -- the timeout-failure
      # branch (after dumping logs) and the success fall-through -- remove the
      # container by hand; there is no separate teardown step to rely on.
      #
      # JOB_DATA_ROOT turns the job API on, which is what makes this a smoke of
      # the console appliance rather than of the web UI alone: enabling it puts
      # the fail-closed credential-scratch setup in the startup path, and that
      # setup writes under root-owned /run. On the default image the server is
      # unprivileged and refuses to boot there unless the image prepared the
      # directory for it, so this step would time out rather than answer; the
      # variant still runs as root, where the same step only exercises the path.
      #
      # The data mount goes to uid 1000 for the same reason: it is the account the
      # default image writes as, and root on the variant leg writes there anyway.
      - name: Smoke the serve role
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/serve-smoke"
          mkdir -p "$data"
          sudo chown 1000:1000 "$data"
          # Published on the loopback interface alone: the probe below reaches it
          # at 127.0.0.1, so nothing needs the runner's other interfaces to carry
          # a console with the job API enabled.
          cid=$(docker run -d -p 127.0.0.1:3000:3000 \
            --env JOB_DATA_ROOT=/data -v "$data":/data \
            ${{ matrix.tag }} serve)
          echo "started server container $cid"

          ok=false
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "server answered HTTP 200 on attempt $attempt"
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != true ]; then
            echo "server did not answer HTTP 200 within the timeout" >&2
            docker logs "$cid" || true
            docker rm -f "$cid" >/dev/null 2>&1 || true
            exit 1
          fi

          docker rm -f "$cid" >/dev/null 2>&1 || true

      # The Windows file-drop setup scripts run their SMB probe inside this
      # image, so the smbclient the runtime stage installs is load-bearing for
      # that setup path: the probe checks for it and stops before it reaches the
      # share when it is missing, so an image published without it strands that
      # setup entirely. `command -v` resolves it from PATH and needs no network
      # and no server. It is `apk add samba-client` on the default image and
      # `dnf install samba-client` on the variant; this assertion is the same on
      # both. The entrypoint is overridden because it dispatches its argv to the
      # CLI, as the setup scripts override it for the same reason.
      - name: Smoke the file-drop probe tooling
        run: docker run --rm --entrypoint sh ${{ matrix.tag }} -c 'command -v smbclient'

      # The variant's entrypoint preamble runs the engagement probe and reports
      # the host kernel's FIPS mode on every run. An operator's only cheap
      # window into what their deployment is actually running, so a preamble
      # that silently stopped reporting would be a real regression. The
      # "FIPS provider active" line is written only on a zero exit from the
      # probe, so this grep is also the assertion that the probe ships in the
      # image and runs there: a missing file or a broken import warns instead.
      - name: Smoke the FIPS entrypoint report
        if: matrix.fips == 'true'
        run: |
          set -euo pipefail
          docker run --rm ${{ matrix.tag }} --help >entrypoint.out 2>&1
          cat entrypoint.out
          grep -q 'FIPS provider active' entrypoint.out
          grep -q 'host kernel' entrypoint.out

      # Does the configuration the image SHIPS engage the provider? The probe in
      # the step below answers a stronger question but answers it about
      # configurations it writes itself, so it cannot answer this one.
      # `crypto.getFips()` is no substitute: it returns 1 with no module loaded
      # at all. This runs the copy INSIDE the image -- the same file the
      # entrypoint runs at every container start, rather than a mounted one that
      # could differ from it -- and it fails unless fips.so is mapped into the
      # process, the five psilink call shapes (AES-256-GCM, HKDF-SHA-256,
      # HMAC-SHA-256, SHA-256, P-256 ECDH) all succeed, and both an MD5 digest
      # and a below-minimum RSA keygen -- which no FIPS provider serves -- fail
      # beside them. The step above reads the same verdict through the exit
      # status; this one is what puts the per-leg JSON transcript in the run log.
      - name: Assert the shipped configuration engages the FIPS provider
        if: matrix.fips == 'true'
        run: |
          docker run --rm \
            --entrypoint node ${{ matrix.tag }} /app/fips-probe/image-engagement.mjs

      # The four-leg attribution, including the causal controls the step above
      # deliberately does not run: the provider is broken (its config MAC
      # corrupted, then its module truncated) and the same AES call re-run, so a
      # success that never depended on the provider is caught. The harness wants
      # a prefix laid out as $PREFIX/lib/ossl-modules/fips.so and
      # $PREFIX/ssl/fipsmodule.cnf; Amazon Linux 2023 ships no fipsmodule.cnf
      # and its `openssl fipsinstall` is disabled, so the stand-in carries only
      # the section header and no module-mac line. The harness reports its own
      # S4a break ineffective on that basis and grades on S4b instead, which is
      # what it is designed to do. It exits 0 whatever it measures, so the
      # verdict is read from PROBE_JSON rather than from the exit status.
      - name: Attribute the engagement with causal controls
        if: matrix.fips == 'true'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/support/fips-probe:/probe:ro" \
            -e PROBE_PREFIX=/tmp/probe-prefix \
            -e PROBE_TMP=/tmp/probe-tmp \
            -e PROBE_OPENSSL_TAG=amzn2023-cert5021 \
            --entrypoint sh ${{ matrix.tag }} -c '
              set -eu
              mkdir -p "$PROBE_PREFIX/lib/ossl-modules" "$PROBE_PREFIX/ssl" "$PROBE_TMP"
              ln -s "$OPENSSL_MODULES/fips.so" "$PROBE_PREFIX/lib/ossl-modules/fips.so"
              printf "[fips_sect]\nactivate = 1\n" >"$PROBE_PREFIX/ssl/fipsmodule.cnf"
              exec node /probe/webcrypto-probe.mjs
            ' >probe.out 2>&1 || true
          grep -F 'PROBE_JSON:' probe.out || { cat probe.out; exit 1; }
          if ! grep -qF '"verdict":"ENGAGED"' probe.out; then
            echo "the FIPS engagement probe did not reach an ENGAGED verdict" >&2
            cat probe.out >&2
            exit 1
          fi

      # A full two-party exchange inside the built variant: two containers of
      # the image, a working directory each, and one shared volume they drop
      # files into. This is the only end-to-end run either image gets -- every
      # other step here starts a process and asks it a question -- and it is
      # what would catch a FIPS configuration that engages the provider and then
      # denies the exchange an algorithm it needs partway through.
      #
      # `--linkage-strategy single-pass` for the round count, not the strategy:
      # measured against this drop transport, the default cascade's twelve
      # polled rounds take 5m36s to the single pass's 40s, and both run the same
      # handshake, AEAD, key schedule and PSI code.
      #
      # SFTP is deliberately not exercised: the variant cannot reach a server
      # offering only curve25519 key exchange, which is a documented limitation
      # rather than a regression (docs/notes/fips-variant-image.md).
      - name: Run a full exchange end-to-end in the image
        if: matrix.fips == 'true'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/a" "$work/b" "$work/share"
          cp test_data/fake_data_1.csv "$work/a/input.csv"
          cp test_data/fake_data_2.csv "$work/b/input.csv"

          for party in a b; do
            docker run -d --name "exchange-$party" \
              -v "$work/$party:/work" -v "$work/share:/share" \
              ${{ matrix.tag }} \
              --linkage-strategy single-pass file:///share input.csv output.csv
          done

          codes=$(timeout 900 docker wait exchange-a exchange-b || true)
          echo "party exit codes: $codes"
          for party in a b; do
            echo "--- party $party ---"
            docker logs "exchange-$party" 2>&1 || true
          done
          docker rm -f exchange-a exchange-b >/dev/null 2>&1 || true

          if [ "$codes" != "$(printf '0\n0')" ]; then
            echo "an exchange party did not exit 0" >&2
            exit 1
          fi

          # Both parties write the same intersection, so a run that "succeeded"
          # while linking nothing is caught here rather than passing on exit 0.
          #
          # Counted from inside a container rather than on the runner: the CLI
          # writes the result CSV owner-only (createOwnerOnlyWriteStream), this
          # variant carries no USER so the parties ran as root, and the bind mount
          # puts a root-owned 0600 file in front of an unprivileged runner shell.
          # Reading it as root preserves the mode the image actually ships with,
          # where running the parties as the runner's uid would smoke something
          # other than the published image. The default leg's bind-mount step
          # above reads its artifacts with sudo for the same reason, at uid 1000.
          for party in a b; do
            lines=$(docker run --rm -v "$work/$party:/work:ro" \
              --entrypoint sh ${{ matrix.tag }} -c 'wc -l </work/output.csv')
            echo "party $party wrote $lines lines of results"
            if [ "$lines" != "11" ]; then
              echo "party $party wrote $lines lines, expected 11 (a header and ten matched rows)" >&2
              exit 1
            fi
          done

      # Every setuid and setgid file in the built image, compared against the
      # inventory docs/spec/CONTAINER_IMAGES.md records for it. No reading of a
      # Dockerfile reaches these: the bits come from base-image state and from an
      # OS package's own file modes, so the instruction text says nothing about
      # them either way.
      #
      # Run as uid 0 on both legs. The inventory is a property of the image's
      # filesystem rather than of what the runtime account can see, and a
      # traversal under an unprivileged account cannot enter a root-only
      # directory -- it would report an absence it never measured.
      #
      # After the functional smokes on purpose: a failing step skips every step
      # after it, and an inventory that has drifted is worth less than the
      # variant's provider assertions and its end-to-end exchange, which have to
      # keep running while the drift is diagnosed. The vulnerability scan below
      # sits after this one for the same reason.
      - name: Measure the image's setuid and setgid files
        run: |
          set -euo pipefail
          measure() {
            docker run --rm --user 0 --entrypoint sh ${{ matrix.tag }} -c "$1"
          }
          probe='find / -xdev -type f \( -perm -2000 -o -perm -4000 \)'

          echo "$probe -exec ls -l {} +"
          measure "$probe -exec ls -l {} +"
          measured=$(measure "$probe" | LC_ALL=C sort)

          case "${{ matrix.variant }}" in
            # The runtime stage takes off the one setgid bit its OS install
            # brings in, and neither stage's base carries another, so nothing is
            # left for this to find.
            default) recorded="" ;;
            # The variant strips nothing and has no reason to: it declares no
            # USER and runs as root, where neither bit elevates anything. What
            # its Amazon Linux 2023 base and package closure carry between them
            # is the list below, and a package that gains or loses a bit reddens
            # this leg rather than shipping. The list sits at the run block's
            # own indentation rather than the arm's, which is what leaves the
            # heredoc terminator in column 1 once YAML has stripped it.
            fips) recorded=$(cat <<'INVENTORY'
          /usr/bin/chage
          /usr/bin/gpasswd
          /usr/bin/mount
          /usr/bin/newgrp
          /usr/bin/su
          /usr/bin/umount
          /usr/bin/write
          /usr/libexec/utempter/utempter
          /usr/sbin/pam_timestamp_check
          /usr/sbin/unix_chkpwd
          INVENTORY
            ) ;;
            *)
              echo "no setuid/setgid inventory is recorded for the ${{ matrix.variant }} image" >&2
              exit 1
              ;;
          esac

          # How an image added to the matrix bootstraps its own row: set its arm
          # to the sentinel and the first run of this step fails that leg and
          # prints the block to paste back, so the surface is enforced from the
          # start rather than left unmeasured until someone writes a list by hand.
          if [ "$recorded" = "@unrecorded" ]; then
            echo "the ${{ matrix.variant }} image's setuid/setgid inventory is unrecorded; this run measures it as:" >&2
            {
              echo "            recorded=\$(cat <<'INVENTORY'"
              printf '%s\n' "$measured"
              echo "INVENTORY"
              echo "            )"
            } >&2
            exit 1
          fi

          if [ "$measured" != "$recorded" ]; then
            echo "the ${{ matrix.variant }} image carries setuid/setgid files the recorded inventory does not name, or is missing one it does" >&2
            diff <(printf '%s\n' "$recorded") <(printf '%s\n' "$measured") >&2 || true
            exit 1
          fi
          echo "the ${{ matrix.variant }} image's setuid/setgid files are the recorded inventory"

      # The OS package layer, which nothing else covers: Dependabot, the
      # dependency review gate and the release `npm audit` all stop at the npm
      # tree, so a vulnerability in the base image or one of its system packages
      # would otherwise reach an operator unflagged. The base is pinned by
      # digest, which is why the weekly schedule above exists -- a vulnerability
      # published against a pin nothing has touched has no other trigger.
      #
      # The scope and the threshold, set here rather than left to a default:
      #   - `vuln-type: os` keeps this to the layer the npm-side gates do not
      #     reach; a second gate over the npm tree would answer to a different
      #     threshold from the first and disagree with it.
      #   - `scanners: vuln` keeps a secret or misconfiguration finding from
      #     failing a step whose threshold is written for vulnerabilities.
      #   - `severity` and `ignore-unfixed` are the threshold: HIGH and above,
      #     fixable only. A gate that fires on a vulnerability no bump can
      #     resolve is unactionable and gets switched off, so an unfixable
      #     finding is deliberately invisible here.
      #   - accepted exceptions are in .github/trivyignore, each id carrying the
      #     reason it was accepted.
      #
      # A finding is a prompt to bump the base digest in the Dockerfile: the pin
      # is deliberate, so nothing on the npm side resolves it, and the docker
      # ecosystem in .github/dependabot.yml opens that bump on its own weekly
      # schedule rather than in answer to this.
      #
      # Scoped to the default image, as the unprivileged-account steps above
      # are, but for a different reason: the variant is published nowhere
      # (docs/RELEASES.md), so nothing its package closure carries reaches an
      # operator, and gating a pull request on it would block a merge over an
      # image no one can pull.
      - name: Scan the image for OS-layer vulnerabilities
        id: vulnerability_scan
        if: matrix.fips == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.tag }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .github/trivyignore
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
          # Holds the SARIF to the same severities the gate answers to, so the
          # Security tab does not collect alerts for findings no run here fails
          # on.
          limit-severities-for-sarif: true

      # Puts the findings in the Security tab beside the CodeQL alerts rather
      # than only in this job's log. It runs whether the scan passed or failed --
      # a failing gate is exactly the run whose findings someone needs to read --
      # and is skipped when the scan step itself did not run.
      #
      # A pull request from a fork carries a read-only token, so there this would
      # fail on the permission rather than on anything it found. The gate above
      # still runs on such a pull request, and the step below is what its
      # findings reach.
      - name: Upload the image scan to code scanning
        id: image_scan_upload
        if: >-
          ${{ !cancelled()
          && steps.vulnerability_scan.outcome != 'skipped'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: container-image-${{ matrix.variant }}

      # The scan writes its report to a file rather than to stdout, so a run
      # whose upload did not succeed would fail the gate while showing nothing
      # it found. This puts the report where such a run can still be read.
      # Conditioned on the upload's outcome rather than on the fork predicate
      # above, so any other reason the alerts do not land is covered too.
      - name: Report the scan findings in the job log
        if: >-
          ${{ !cancelled()
          && steps.vulnerability_scan.outcome != 'skipped'
          && steps.image_scan_upload.outcome != 'success' }}
        run: cat trivy-image.sarif
