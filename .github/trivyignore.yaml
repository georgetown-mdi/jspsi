      Denial of service in libevent's RPC handling of malformed data. This
      entry covers the FIPS variant image's Amazon Linux libevent at
      2.1.12-3.amzn2023.0.3, fixed at 2.1.12-3.amzn2023.0.4, and no other
      package. Accepted because the vulnerable path is libevent's own RPC
      machinery, which an application reaches only by calling it. libevent
      is in this image as a transitive dependency of the base package
      closure: Dockerfile.fips installs it by no name, and it reaches the
      built image's package list through another package's requirement.
      Nothing the image runs calls it -- both roles are node processes,
      and the only other executables a run reaches are the two shell
      entrypoints and smbclient. Cleared by moving Dockerfile.fips to the
      amazonlinux:2023 rootfs carrying 2023.12.20260914 or later, the
      first snapshot serving 2.1.12-3.amzn2023.0.4. No published rootfs
      carries that release -- the newest, measured 2026-09-15, is
      2023.12.20260831 -- and the build asserts that the rootfs release
      equals the dnf releasever, so a snapshot-only bump fails by design
      and there is no base to bump to. This entry comes out in the same
      diff as that bump, which "Bumping the FIPS base image" in
      docs/spec/DEPENDENCY_PINS.md describes.
