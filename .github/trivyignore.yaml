  # Accepted 2026-09-15. The Amazon Linux openssl packages.
  - id: CVE-2026-75803
    purls:
      - pkg:rpm/amazon/openssl
      - pkg:rpm/amazon/openssl-libs
    statement: >-
      ChaCha20-Poly1305 and AES-OCB decryption of an empty ciphertext
      finalized through EVP_Cipher() reports success without verifying the
      authentication tag. This entry covers the FIPS variant image's
      Amazon Linux openssl and openssl-libs at 1:3.5.7-2.amzn2023.0.1,
      fixed at 1:3.5.8-1.amzn2023.0.1, and no other package. Accepted
      because neither cipher nor that call shape is on an Alcove path: the
      application-layer AEAD is AES-GCM through WebCrypto
      (packages/core/src/connection/encryptedMessageConnection.ts), which
      the advisory does not name and which does not finalize through
      EVP_Cipher(), and the advisory records no FIPS impact for the 3.5
      module. SMB3 encrypts with AES-CCM and AES-GCM, so smbclient does
      not meet the cipher condition either. Alcove's own cryptography
      does not run on these two: node comes from the official tarball
      rather than from a package and links its own libcrypto, and the
      certified module this image is built around
      (openssl-fips-provider-certified 3.2.2-1.amzn2023, a separate
      package with no finding here) is what serves that cryptography,
      cross-loaded into the libcrypto node links. What reads these two
      packages in the image is the openssl CLI, which the build uses once
      to read the loaded provider back and which the entrypoint does not
      consult because it answers for a different libcrypto and a different
      consumer, and the samba client libraries. Cleared by moving
      Dockerfile.fips to the amazonlinux:2023 rootfs carrying
      2023.12.20260914 or later, the first snapshot serving
      1:3.5.8-1.amzn2023.0.1. No published rootfs carries that release --
      the newest, measured 2026-09-15, is 2023.12.20260831 -- and the
      build asserts that the rootfs release equals the dnf releasever, so
      a snapshot-only bump fails by design and there is no base to bump
      to. This entry comes out in the same diff as that bump, which
      "Bumping the FIPS base image" in docs/spec/DEPENDENCY_PINS.md
      describes.
    expired_at: 2026-10-15
