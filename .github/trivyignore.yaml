# Accepted exceptions to the container image vulnerability scan that
# .github/workflows/image_smoke.yaml runs on a pull request, on its weekly
# schedule and against the published tag, and .github/workflows/release.yaml
# runs ahead of a publish.
#
# That scan fails on a vulnerability in one of the image's OS or language
# packages that is HIGH or CRITICAL and has a fix available; image_smoke.yaml's
# scan of the FIPS variant gates on every trigger, pull requests included, and
# reads this same list, so it fails its run on a non-ignored finding the same
# as the default leg. An entry here exempts one vulnerability id from every one
# of them, and is a reviewed decision rather than a way to quiet a build: write
# the reason it was accepted in `statement`, so a reader can tell an assessed
# exception from a forgotten one.
#
# Every entry carries an `expired_at`. Trivy stops applying an entry on that
# date and the finding returns, which is the only thing that would ever prompt
# the entry's removal: while it is in force the gate is green whether or not
# the condition it was written for still holds, so the weekly scheduled scan in
# image_smoke.yaml cannot report a stale acceptance on its own. Expiry turns
# that silence into a dated re-read -- either the acceptance is renewed with a
# new date, or the entry comes out.
#
# The extension is required: Trivy picks its parser from it, so this content
# under an extensionless name parses as a plain list of ids, matches nothing
# here, and suppresses nothing. Both malformed shapes fail visibly rather than
# silently widening the exemption -- a body that does not parse as this schema
# exempts nothing, and an unparseable `expired_at` aborts the scan.
#
# Scope every entry to the packages it was assessed against. An id on its own
# applies to every package of every image scanned, and the two images hold
# different OS package sets -- Alpine in the default image, Amazon Linux in the
# FIPS variant -- so an unscoped entry also suppresses the id on a package whose
# fix is published and reachable. A `purls` list holds the entry to the packages
# it names.
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       purls:
#         - pkg:apk/alpine/some-package
#       statement: "why this was accepted"
#       expired_at: 2026-01-01

vulnerabilities:
  # Accepted 2026-09-10.
  - id: CVE-2026-14456
    purls:
      - pkg:rpm/amazon/openssl
      - pkg:rpm/amazon/openssl-libs
    statement: >-
      OpenSSL denial of service via unbounded memory growth in the QUIC
      server. This entry covers the FIPS variant image's Amazon Linux openssl
      and openssl-libs at 1:3.5.7-2.amzn2023.0.1, fixed at
      1:3.5.7-2.amzn2023.0.2, and no other package. No pin movement reaches
      those two: the fix is served by the 2023.12.20260831 and later package
      snapshots, but no published amazonlinux:2023 rootfs is newer than
      2023.12.20260817 -- the release the digest in Dockerfile.fips already
      pins, measured 2026-09-10 -- and that build asserts the rootfs release
      equals the dnf releasever, so a snapshot-only bump fails by design and
      there is no base to bump to. Accepted because the vulnerable path is a
      QUIC server and no Alcove role opens one: Alcove's transports are SFTP
      over ssh2, WebRTC data channels, file drop, and the console's localhost
      HTTP server, and the image's other OpenSSL consumers are the openssl CLI
      and samba-client. Cleared by the base bump "Bumping the FIPS base image"
      in docs/spec/DEPENDENCY_PINS.md describes, once Docker Hub rebuilds the
      amazonlinux:2023 tag onto a 2023.12.20260831 or later rootfs, and this
      entry comes out in that same diff.
    expired_at: 2026-10-15

  # Accepted 2026-09-15. The samba client closure.
  - id: CVE-2026-6949
    purls:
      - pkg:rpm/amazon/libsmbclient
      - pkg:rpm/amazon/libwbclient
      - pkg:rpm/amazon/samba-client
      - pkg:rpm/amazon/samba-client-libs
      - pkg:rpm/amazon/samba-common
      - pkg:rpm/amazon/samba-common-libs
    statement: >-
      Samba's DNS server crashes on a TSIG packet with crafted name
      compression. This entry covers the FIPS variant image's Amazon Linux
      libsmbclient, libwbclient, samba-client, samba-client-libs,
      samba-common and samba-common-libs at 2:4.17.12-1.amzn2023.0.5,
      fixed at 2:4.17.12-1.amzn2023.0.7, and no other package. Accepted
      because the vulnerable path is Samba's DNS server and no Alcove
      role runs one. The image does install samba-client, and Alcove's
      doctor command runs smbclient inside it to probe a Windows file-drop
      share, so this closure is reached; no samba server or authentication
      component is. The built image's own package list
      (NOTICE-os-packages-fips.tsv) holds no smbd, nmbd, winbindd or
      samba-winbind, and neither role authenticates a Unix account or
      serves DNS. Cleared by moving Dockerfile.fips to the
      amazonlinux:2023 rootfs carrying 2023.12.20260914 or later, the
      first snapshot serving 2:4.17.12-1.amzn2023.0.7. No published rootfs
      carries that release -- the newest, measured 2026-09-15, is
      2023.12.20260831 -- and the build asserts that the rootfs release
      equals the dnf releasever, so a snapshot-only bump fails by design
      and there is no base to bump to. This entry comes out in the same
      diff as that bump, which "Bumping the FIPS base image" in
      docs/spec/DEPENDENCY_PINS.md describes.
    expired_at: 2026-10-15
